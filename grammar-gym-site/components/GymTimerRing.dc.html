<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grammar Gym timer ring</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div aria-hidden="true" style="width: 402px; height: 874px; position: relative; pointer-events: none">
  <svg width="402" height="874" viewBox="0 0 402 874" style="position: absolute; left: 0; top: 0">
    <rect x="2" y="2" width="398" height="870" rx="38" ry="38" fill="none" stroke="#F0F3F5" stroke-width="4"></rect>
    <rect x="2" y="2" width="398" height="870" rx="38" ry="38" fill="none" stroke="{{ringColor}}" stroke-opacity="{{ringOpacity}}" stroke-width="4" pathLength="100" stroke-dasharray="100" stroke-dashoffset="{{ringOffset}}" style="transition: stroke-dashoffset 1s linear, stroke 0.3s, stroke-opacity 0.3s"></rect>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"timeLeft":{"editor":"int","default":30,"min":0,"max":60},"timeTotal":{"editor":"int","default":60,"min":1,"max":600},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    const timeTotal = Number(this.props.timeTotal ?? 60);
    const timeLeft = Math.max(0, Number(this.props.timeLeft ?? timeTotal));
    const used = 1 - timeLeft / timeTotal;
    return {
      ringOffset: (100 * (timeLeft / timeTotal)).toFixed(2),
      ringColor: used > 0.7 ? '#EF4444' : (used >= 0.6 ? '#FF9900' : '#22C45D'),
      ringOpacity: timeLeft >= timeTotal ? 0 : 1,
    };
  }
}
</script>
</body>
</html>
