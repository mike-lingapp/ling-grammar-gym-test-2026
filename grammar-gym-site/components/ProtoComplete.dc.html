<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grammar Gym complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;family=Poppins:wght@600;700&amp;display=swap">
<style>
html,body{overflow:hidden;overscroll-behavior:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;font-family:'Noto Sans',sans-serif;background:#FFFFFF;color:#3D505C}
.gg-btn:focus-visible{outline:3px solid #33B2FF;outline-offset:2px}
@keyframes ggPop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes ggFadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.gg-anim{animation:none!important;opacity:1!important}}
</style>
</helmet>
<div style="width: 402px; height: 874px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; font-family: 'Noto Sans', sans-serif; color: #3D505C; position: relative; overflow: hidden">

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 54px 0 24px">
    <h1 class="gg-anim" style="animation: ggFadeUp 0.45s ease-out both; margin: 0; padding: 16px; font-family: 'Poppins', sans-serif; font-size: 26px; line-height: 1.25; font-weight: 700; color: #3D505C; text-align: center">Grammar Gym complete</h1>

    <div style="padding: 16px; display: flex; justify-content: center">
      <!-- Stand-in for the lesson-complete animation (Ling + Gaia GIF in Figma); swap for the real asset. -->
      <div class="gg-anim" aria-hidden="true" style="width: 312px; height: 242px; display: flex; align-items: center; justify-content: center; animation: ggPop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both">
        <img src="/_blob/b3db8c259c9a4ef446e17a9d874f80b8" alt="" width="200" height="200" style="display: block; width: 200px; height: 200px">
      </div>
    </div>

    <div style="padding: 8px 16px">
      <div class="gg-anim" style="animation: ggFadeUp 0.45s ease-out 0.3s both; min-height: 72px; box-sizing: border-box; padding: 12px 16px; border-radius: 16px; border: 1px solid #E0E7EB; background: #FFFFFF; display: flex; align-items: center; gap: 16px">
        <svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0"><path d="M7 3C7.55228 3 8 3.44772 8 4C8 4.55228 7.55228 5 7 5H5.43359L5.35059 5.2627C5.24233 5.63597 5.16603 6.01608 5.12207 6.39844C5.30056 6.57172 5.43325 6.79329 5.5 7.04492C5.91263 8.57827 6.62599 10.007 7.57227 11.2334C8.54169 12.4898 9.74673 13.5323 11.1035 14.3125C12.4602 15.0926 13.969 15.6103 15.5459 15.8184C17.0851 16.0214 18.6845 15.9221 20.2246 15.5137C20.8062 15.3563 21.4244 15.5858 21.7607 16.084C22.0971 16.5821 22.0776 17.2387 21.7119 17.7158C20.2919 19.5643 18.2703 20.9766 15.8408 21.625C9.98013 23.189 3.94732 19.7191 2.37695 13.8818C1.72607 11.4621 1.94361 9.01314 2.83887 6.86328C2.90479 6.70586 2.99705 6.56501 3.10938 6.44531C3.14998 5.9596 3.23088 5.47637 3.35156 5H3C2.44772 5 2 4.55228 2 4C2 3.44772 2.44772 3 3 3H7Z" fill="#FFC83D"></path></svg>
        <span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column">
          <span style="font-size: 16px; line-height: 1.5; font-weight: 700; color: #3D505C; font-variant-numeric: tabular-nums">{{pointsText}}</span>
          <span style="font-size: 14px; line-height: 1.5; color: #5C788A">Banana Points</span>
        </span>
      </div>
    </div>

    <div style="padding: 16px; display: flex; justify-content: center">
      <button class="gg-btn" aria-label="Share" style="width: 64px; height: 64px; padding: 0; border-radius: 384px; border: 1px solid #E0E7EB; background: #FFFFFF; color: #3D505C; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8L12 3.5L16.5 8"></path><path d="M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"></path></svg>
      </button>
    </div>
  </div>

  <div class="gg-anim" style="animation: ggFadeUp 0.45s ease-out 0.5s both; flex-shrink: 0; border-top: 1px solid #E0E7EB; padding: 8px 16px 34px">
    <button class="gg-btn" onClick="{{done}}" style="width: 100%; min-height: 48px; box-sizing: border-box; padding: 8px 16px; border: 0; border-radius: 16px; font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.5; cursor: pointer; background: #FF9900; color: #FFFFFF">Continue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"points":{"editor":"int","default":100,"min":0,"max":1000},"onContinue":{"editor":null},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { p: 1 };
  }
  // Count the banana points up from 0 when the screen opens (skipped for reduced motion).
  componentDidMount() {
    const reduce = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    const t0 = Date.now() + 400;
    this.setState({ p: 0 });
    this.timer = setInterval(() => {
      const p = Math.max(0, Math.min(1, (Date.now() - t0) / 900));
      this.setState({ p: 1 - Math.pow(1 - p, 3) });
      if (p >= 1) clearInterval(this.timer);
    }, 30);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const points = Number(this.props.points ?? 100);
    return {
      pointsText: '+' + Math.round(points * this.state.p),
      // Inside the Full flow: back to where the learner started (Learn tab or Review tab).
      done: () => { if (typeof this.props.onContinue === 'function') this.props.onContinue(); },
    };
  }
}
</script>
</body>
</html>
