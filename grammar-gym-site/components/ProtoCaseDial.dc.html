<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Case Dial, picker wheel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Thai+Looped:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{overflow:hidden;overscroll-behavior:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;font-family:'Noto Sans',sans-serif;background:#FFFFFF;color:#29353D}
a{color:#006EB2}a:hover{color:#005E99}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:lang(th){font-family:'Noto Sans Thai Looped','Noto Sans',sans-serif}
.wheel:focus-visible{outline:3px solid #33B2FF;outline-offset:2px}
.wheel:active{cursor:grabbing}
.fbs{animation:rise .25s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</helmet>
<div style="width: 402px; height: 874px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; padding: 62px 16px 34px; font-family: 'Noto Sans', sans-serif; color: #29353D; position: relative; overflow: hidden">

  <dc-import name="GymHeader" step="3" done="{{stageDone}}" total="6" lives="{{lives}}" timed="{{timedOn}}" time-total="{{timeTotal}}" paused="{{headerPaused}}" run="{{resets}}" on-tick="{{tick}}" on-close="{{close}}" hint-size="100%,92px"></dc-import>

  

  <div style="flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding-top: 24px">
    <h1 style="margin: 0; font-size: 18px; line-height: 27px; font-weight: 700; color: #29353D">{{title}}</h1>
    <p lang="{{langTag}}" style="margin: 10px 0 0; font-size: 26px; line-height: 36px; font-weight: 700; color: #29353D">{{before}}<span style="display: inline-block; min-width: 96px; margin: 0 {{gapMR}}px 0 {{gapML}}px; padding: 0 6px; border-bottom: 3px solid {{gapLine}}; color: {{gapInk}}; text-align: center; transition: color 0.2s, border-color 0.2s">{{gapText}}</span>{{after}}</p>
    <sc-if value="{{hasTr}}" hint-placeholder-val="{{ false }}"><p style="margin: 2px 0 0; font-size: 16px; line-height: 24px; font-weight: 500; color: #5C788A">{{trBefore}}<b style="font-weight: 600; color: {{trInk}}">{{trSel}}</b>{{trAfter}}</p></sc-if>
    <p style="margin: 2px 0 0; font-size: 16px; line-height: 24px; color: #5C788A">{{prompt}}</p>

    <div style="margin-top: 12px; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 2px">
      <button onClick="{{up}}" disabled="{{upOff}}" aria-label="Previous case" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: {{upInk}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg>
      </button>

      <div class="wheel" role="listbox" aria-label="Cases" tabindex="0" onKeyDown="{{key}}" onWheel="{{wheel}}" onPointerDown="{{down}}" onPointerMove="{{drag}}" onPointerUp="{{release}}" onPointerCancel="{{release}}" style="width: 100%; height: 400px; flex: 0 1 400px; min-height: 0; position: relative; overflow: hidden; border-radius: 20px; background: #F9FAFB; border: 2px solid #F0F3F5; box-sizing: border-box; touch-action: none; user-select: none; cursor: grab">
        <span class="sr" role="status">{{srText}}</span>
        <div aria-hidden="true" style="position: absolute; left: 8px; right: 8px; top: calc(50% - 32px); height: 64px; box-sizing: border-box; border-radius: 14px; border: 2px solid {{bandLine}}; background: {{bandBg}}; box-shadow: 0 4px 12px rgba(31,40,46,0.10); transition: background 0.2s, border-color 0.2s"></div>
        <div style="position: absolute; left: 0; right: 0; top: calc(50% - 32px); transform: translateY({{trackY}}px); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1)">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
            <button onClick="{{r.pick}}" disabled="{{locked}}" tabindex="-1" role="option" aria-selected="{{r.centre}}" style="width: 100%; height: 64px; padding: 0 24px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; font-family: 'Noto Sans', sans-serif; opacity: {{r.opacity}}; transform: scale({{r.scale}}); transition: opacity 0.35s, transform 0.35s; cursor: pointer">
              <span lang="{{r.langTag}}" style="font-size: 22px; line-height: {{r.lh}}px; font-weight: 800; color: {{r.ink}}; text-align: center; overflow-wrap: anywhere">{{r.form}}</span>
              <span style="font-size: 13px; line-height: 18px; font-weight: 500; color: {{r.subInk}}; text-align: center">{{r.full}}</span>
            </button>
          </sc-for>
        </div>
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 30%; background: linear-gradient(#F9FAFB, rgba(249,250,251,0)); pointer-events: none"></div>
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(rgba(249,250,251,0), #F9FAFB); pointer-events: none"></div>
      </div>

      <button onClick="{{downStep}}" disabled="{{downOff}}" aria-label="Next case" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: {{downInk}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
  </div>
  <sc-if value="{{showCheck}}" hint-placeholder-val="{{ true }}">
    <button onClick="{{check}}" style="width: 100%; height: 48px; margin-top: 16px; flex-shrink: 0; border: 0; border-radius: 12px; background: #FF9900; color: #FFFFFF; font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">Check</button>
  </sc-if>
  <sc-if value="{{checked}}" hint-placeholder-val="{{ false }}">
    <div class="fbs" role="status" style="margin: 16px -16px -34px; padding: 20px 16px 34px; border-radius: 20px 20px 0 0; background: {{fb.bg}}; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <sc-if value="{{fb.ok}}" hint-placeholder-val="{{ true }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="{{fb.ink}}" stroke="none"><circle cx="12" cy="12" r="11"></circle><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </sc-if>
        <sc-if value="{{fb.bad}}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="{{fb.ink}}" stroke="none"><circle cx="12" cy="12" r="11"></circle><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg>
        </sc-if>
        <sc-if value="{{fb.clock}}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="{{fb.ink}}" stroke="none"><circle cx="12" cy="12" r="11"></circle><path d="M12 6.5V12l3.5 2.2" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </sc-if>
        <span style="flex-grow: 1; font-size: 20px; font-weight: 800; color: {{fb.ink}}">{{fb.title}}</span>
        <button aria-label="Report a problem" style="width: 44px; height: 44px; margin-right: -10px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: {{fb.ink}}; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>
        </button>
      </div>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: #29353D"><strong lang="{{langTag}}" style="font-weight: 700">{{fb.answer}}</strong><br><span lang="{{langTag}}" style="color: #3D505C">{{fbNote}}</span></p>
      <sc-if value="{{showRuleLink}}" hint-placeholder-val="{{ false }}">
        <button onClick="{{openRule}}" style="align-self: flex-start; min-height: 40px; padding: 0 12px 0 8px; border-radius: 12px; border: 2px solid #F5C2C2; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-family: 'Noto Sans', sans-serif; font-size: 15px; font-weight: 700; color: #A40E0E; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink: 0"><path d="M12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2ZM12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4ZM12 14.75C12.6904 14.75 13.25 15.3096 13.25 16C13.25 16.6904 12.6904 17.25 12 17.25C11.3096 17.25 10.75 16.6904 10.75 16C10.75 15.3096 11.3096 14.75 12 14.75ZM12 6C12.5523 6 13 6.44772 13 7V12C13 12.5523 12.5523 13 12 13C11.4477 13 11 12.5523 11 12V7C11 6.44772 11.4477 6 12 6Z"></path></svg>{{ruleLinkText}}</button>
      </sc-if>
      <button onClick="{{next}}" style="margin-top: 4px; height: 48px; border-radius: 12px; background: {{fb.btn}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; width: 100%; border: 0; font-family: 'Noto Sans', sans-serif; cursor: pointer">{{nextLabel}}</button>
      <sc-if value="{{canSkip}}" hint-placeholder-val="{{ false }}">
        <button onClick="{{skip}}" style="height: 48px; border-radius: 12px; background: transparent; color: {{fb.ink}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; width: 100%; border: 0; font-family: 'Noto Sans', sans-serif; cursor: pointer">Continue</button>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{timedOn}}" hint-placeholder-val="{{ true }}">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 402px; height: 874px; pointer-events: none">
    <dc-import name="GymTimerRing" time-left="{{timeLeft}}" time-total="{{timeTotal}}" hint-size="402px,874px"></dc-import>
  </div>
  </sc-if>
  <sc-if value="{{infoOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; width: 402px; height: 874px; z-index: 40">
      <dc-import name="GymInfoSheet" title="{{info.title}}" kicker="{{info.kicker}}" body="{{info.body}}" table="{{info.table}}" examples="{{info.examples}}" tips="{{info.tips}}" lang-tag="{{langTag}}" on-close="{{closeInfo}}" hint-size="402px,874px"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onFinish":{"editor":null},"active":{"editor":null},"run":{"editor":null},"onOut":{"editor":null},"onClose":{"editor":null},"paused":{"editor":null},"timed":{"editor":null},"depleted":{"editor":null},"rule":{"editor":null},"item":{"editor":null},"spacing":{"editor":null},"langTag":{"editor":null},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh();
    this.lastWheel = 0;
  }
  // A clean start: used on first load, when the Full flow shows this stage, and on Train again.
  fresh() {
    // Never start the wheel on the right answer (e.g. Thai ตัว is first on the wheel).
    const c = this.props && this.props.item ? this.props.item.c : 4;
    return { ...{ info: null, sel: c === 0 ? 1 : 0, checked: false, misses: 0, timedOut: false, timeLeft: 60 }, resets: ((this.state && this.state.resets) || 0) + 1 };
  }
  componentDidUpdate(prev) {
    const on = this.props.active !== false;
    const was = prev.active !== false;
    if ((on && !was) || this.props.run !== prev.run) { this.outSent = false; this.setState(this.fresh()); return; }
    // Last life gone: tell the Full flow at once so it can show the failed panel.
    if (on && this.lives === 0 && this.props.depleted !== true && !this.outSent && typeof this.props.onOut === 'function') {
      this.outSent = true;
      this.props.onOut();
    }
  }
  renderVals() {
    // Content comes from the Full flow (one row of the language's Case Dial sheet);
    // on its own the screen plays this Serbian row.
    const item = this.props.item || {
      before: 'Idem sa', after: '.', prompt: 'I’m going with the boy.',
      tiles: [['dečak', 'Nominative'], ['dečaka', 'Genitive / Accusative'], ['dečaku', 'Dative / Locative'], ['dečače', 'Vocative'], ['dečakom', 'Instrumental']],
      c: 4, full: 'Idem sa dečakom.', fb: 'Sa (with) takes the instrumental: dečakom.',
    };
    const langTag = this.props.langTag || 'sr-Latn';
    const thai = langTag === 'th';
    const list = item.tiles.map((t) => ({ form: t[0], full: t[1] }));
    const correct = item.c;
    const rowH = 64;
    const { sel, checked } = this.state;
    const timedOut = this.state.timedOut === true;
    const ok = checked && !timedOut && sel === correct;
    const go = (n) => { if (!this.state.checked) this.setState({ sel: Math.max(0, Math.min(list.length - 1, n)) }); };
    // Wheel rows (Mike v2): centre row in deep blue with a blue label; green or red once checked.
    const rows = list.map((c, i) => {
      const d = Math.abs(i - sel);
      const centre = d === 0;
      let ink = '#29353D', subInk = '#5C788A';
      if (centre) {
        ink = checked ? (ok ? '#0F5729' : '#8D0C0C') : '#003F66';
        subInk = checked ? (ok ? '#17823E' : '#D31212') : '#006EB2';
      }
      return {
        ...c, ink, subInk, langTag, centre,
        lh: thai ? 32 : 28,
        opacity: d === 0 ? 1 : (d === 1 ? 0.55 : 0.25),
        scale: d === 0 ? 1 : (d === 1 ? 0.9 : 0.8),
        // A tap picks the row, unless the finger was dragging the wheel.
        pick: () => { if (!this.dragged) go(i); },
      };
    });
    let gapInk = '#006EB2', gapLine = '#33B2FF', bandBg = '#FFFFFF', bandLine = '#33B2FF';
    if (checked) {
      gapInk = ok ? '#17823E' : '#A40E0E'; gapLine = ok ? '#51E186' : '#EF4444';
      bandBg = ok ? '#E9FBF0' : '#FDE8E8'; bandLine = ok ? '#51E186' : '#EF4444';
    }
    // Answer text (Mike v2). Thai joins the sentence and its romanisation with a middle dot,
    // and the wrong answer names the classifier, its romanisation and the whole sentence.
    const fullText = thai ? item.full.replace(/\s*\(([^)]*)\)\s*$/, ' · $1') : item.full;
    const badAnswer = thai
      ? 'Answer: ' + list[correct].form + ' (' + list[correct].full + ') · ' + item.full.replace(/\s*\([^)]*\)\s*$/, '')
      : 'Answer: ' + list[correct].form + ' (' + list[correct].full.toLowerCase() + ')';
    const fb = ok
      ? { ok: true, bad: false, clock: false, bg: '#E9FBF0', ink: '#17823E', btn: '#1A9848', title: 'Excellent!', answer: fullText }
      : { ok: false, bad: !timedOut, clock: timedOut, bg: '#FEF3F3', ink: '#A40E0E', btn: '#D31212', title: timedOut ? 'Time’s up' : 'Not quite', answer: badAnswer };
    // After Try again on an out-of-lives game the lives stay at 0 and the game can't score higher.
    const depleted = this.props.depleted === true;
    const lives = depleted ? 0 : Math.max(0, 3 - this.state.misses - (timedOut ? 1 : 0));
    const retry = checked && !ok && !timedOut && (depleted || lives > 0);
    if (retry) fb.answer = 'Try again';
    // While retrying, show only the rule (the part before the colon), not the answer.
    const rule = item.fb.split(':')[0];
    const fbNote = retry ? (rule.includes(list[correct].form) ? 'Look at the noun again and spin to another form.' : rule + '.') : item.fb;
    // Thai joins words with no spaces; Italian adds a space after the tile unless it ends in an apostrophe.
    const spacing = this.props.spacing || 'normal';
    const gapML = spacing === 'join' ? 0 : 8;
    const gapMR = spacing === 'after' && !/'$/.test(list[sel].form) ? 8 : 0;
    this.lives = lives;
    // Each exercise has its own 3 lives. Inside the Full flow the parent passes onFinish; on its own Continue replays this screen.
    const embedded = typeof this.props.onFinish === 'function';
    return {
      // Info sheets (rule, tag, pattern): the timer pauses while one is open.
      infoOpen: !!this.state.info,
      info: this.state.info || {},
      closeInfo: () => this.setState({ info: null }),
      // Train again runs untimed: only the total time is counted on Results.
      timedOn: this.props.timed !== false,
      embedded,
      standalone: !embedded,
      title: item.title || (thai ? 'Spin to the right classifier' : 'Spin to the right case'),
      // X in the header: the Full flow asks to confirm, then goes back to the Grammar exercises list.
      close: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); },
      // Wrong with lives left: try again (answer stays hidden). Right, timed out or out of lives: move on.
      // Timer (60 s, same as Form Forge and Lane Sort): pauses while answered or while the quit sheet is open; time up costs a life and moves on.
      resets: this.state.resets,
      headerPaused: this.props.active === false || this.props.paused === true || !!this.state.info || this.state.checked === true || this.state.timedOut === true,
      timeTotal: 60,
      timeLeft: this.state.timeLeft,
      tick: (t) => this.setState(t <= 0 ? { timeLeft: 0, checked: true, timedOut: true } : { timeLeft: t }),
      // Out of lives and practising: Try again as often as you like, or Continue to settle with the mistake and move on.
      canSkip: retry && this.props.depleted === true && typeof this.props.onFinish === 'function',
      skip: () => { if (typeof this.props.onFinish === 'function') this.props.onFinish({ ok: false, lives: 0, correct: 0, mistakes: this.state.misses }); },
      stageDone: checked && !retry,
      nextLabel: retry ? 'Try again' : 'Continue',
      next: () => { if (retry) this.setState({ checked: false }); else if (embedded) this.props.onFinish({ ok: ok, lives, correct: ok ? 1 : 0, mistakes: this.state.misses + (timedOut ? 1 : 0) }); else this.setState(this.fresh()); },
      lives,
      rows,
      langTag, fbNote, gapML, gapMR,
      // Wrong answer: link back to the rule card taught before the exercises (Learn the rule).
      showRuleLink: checked && !ok && !!this.props.rule,
      ruleLinkText: 'Review the rule',
      openRule: () => this.setState({ info: this.props.rule }),
      // Romanisation under the sentence (Thai): the selected tile's romanisation in bold, coloured like the gap.
      hasTr: !!item.tr,
      trBefore: item.tr && item.tr.before ? item.tr.before + ' ' : '',
      trSel: list[sel].full,
      trAfter: item.tr && item.tr.after ? ' ' + item.tr.after : '',
      trInk: checked ? (ok ? '#17823E' : '#A40E0E') : '#006EB2',
      before: item.before, after: item.after, prompt: item.prompt,
      locked: checked,
      trackY: -sel * rowH,
      srText: list[sel].form + ', ' + list[sel].full,
      gapText: list[sel].form,
      gapInk, gapLine, bandBg, bandLine,
      up: () => go(sel - 1),
      downStep: () => go(sel + 1),
      upOff: checked || sel === 0,
      downOff: checked || sel === list.length - 1,
      upInk: checked || sel === 0 ? '#C2CED6' : '#29353D',
      downInk: checked || sel === list.length - 1 ? '#C2CED6' : '#29353D',
      wheel: (e) => {
        const now = Date.now();
        if (now - this.lastWheel < 160 || Math.abs(e.deltaY) < 4) return;
        this.lastWheel = now;
        go(this.state.sel + (e.deltaY > 0 ? 1 : -1));
      },
      key: (e) => {
        if (e.key === 'ArrowDown') { go(this.state.sel + 1); e.preventDefault(); }
        if (e.key === 'ArrowUp') { go(this.state.sel - 1); e.preventDefault(); }
      },
      // The wheel follows the finger: every 64px of drag moves one row, live (Mike v2).
      down: (e) => {
        if (this.state.checked) return;
        this.dragY = e.clientY; this.dragFrom = this.state.sel; this.dragged = false;
        if (e.currentTarget && e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
      },
      drag: (e) => {
        if (this.dragY == null) return;
        const steps = Math.round((this.dragY - e.clientY) / rowH);
        if (steps) this.dragged = true;
        const to = Math.max(0, Math.min(list.length - 1, this.dragFrom + steps));
        if (to !== this.state.sel) go(to);
      },
      release: () => {
        this.dragY = null;
        setTimeout(() => { this.dragged = false; }, 0);
      },
      showCheck: !checked, checked,
      check: () => this.setState(sel === correct ? { checked: true } : { checked: true, misses: this.state.misses + 1 }),
      fb,
    };
  }
}
</script>
</body>
</html>
