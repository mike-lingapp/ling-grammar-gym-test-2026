<script type="text/x-dc" data-dc-script data-props='{"results":{"editor":null},"seconds":{"editor":null},"crowns":{"editor":"int","default":1,"min":1,"max":3},"timed":{"editor":null},"language":{"editor":null},"onRestart":{"editor":null},"onContinue":{"editor":null},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { p: 1 };
  }
  // Count the stats up from 0 when the screen opens (skipped for reduced motion or on its own).
  componentDidMount() {
    const reduce = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!Array.isArray(this.props.results) || reduce) return;
    const t0 = Date.now() + 450;
    this.setState({ p: 0 });
    this.timer = setInterval(() => {
      const p = Math.max(0, Math.min(1, (Date.now() - t0) / 900));
      this.setState({ p: 1 - Math.pow(1 - p, 3) });
      if (p >= 1) clearInterval(this.timer);
    }, 30);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const p = this.state.p;
    const names = [
      { name: 'Lane Sort', skill: 'Sort nouns by gender' },
      { name: 'Form Forge', skill: 'Pick the right word' },
      { name: 'Case Dial', skill: 'Spin to the right word' },
      { name: 'Gender Match', skill: 'Match the pairs' },
    ];
    // From the Full flow: results = [{ ok }] per exercise, seconds = total time.
    // On its own the screen shows placeholders.
    const results = Array.isArray(this.props.results) ? this.props.results : null;
    const embedded = typeof this.props.onRestart === 'function';
    const right = results ? results.filter((r) => r && r.ok).length : 0;
    // Each of the 6 games is an equal share; Lane Sort's and Verb Match's shares are split over their items.
    const share = (r) => {
      if (!r) return 0;
      if (r.total) return Math.max(0, Math.min(1, (r.correct || 0) / r.total));
      const c = r.correct || 0, m = r.mistakes || 0;
      return c + m > 0 ? c / (c + m) : (r.ok ? 1 : 0);
    };
    const acc = results ? results.reduce((n, r) => n + share(r), 0) / names.length : 0;
    const secs = Number(this.props.seconds);
    const hasTime = results && Number.isFinite(secs);
    const crowns = Math.max(1, Math.min(3, Number(this.props.crowns) || 1));
    const crownDots = [63, 143, 223].map((cx, k) => {
      const on = k < crowns;
      return { cx, gx: cx - 18, fill: on ? '#FFE9A8' : '#F9FAFB', ring: on ? '#FFC83D' : '#E0E7EB', a: on ? '#FF9900' : '#E0E7EB', b: on ? '#FFB647' : 'transparent', cls: k === crowns - 1 ? 'gg-crown-new' : '', delay: '0.2' };
    });
    const crownVals = { c0: crownDots[0], c1: crownDots[1], c2: crownDots[2], bar1: crowns >= 2 ? '#FFC83D' : '#E0E7EB', bar2: crowns >= 3 ? '#FFC83D' : '#E0E7EB', crownLabel: crowns + ' of 3 crowns' };
    return {
      exercises: names.map((n, i) => {
        const delay = 0.65 + i * 0.1;
        const ok = results ? !!(results[i] && results[i].ok) : true;
        // Lives left in that exercise (each one starts with 3); 0 if it was never reached.
        const left = results ? (results[i] && Number.isFinite(results[i].lives) ? results[i].lives : 0) : 3;
        // Life counter atom: brand cells for lives left, disabled cells for lives lost.
        const segs = [0, 1, 2].map((k) => ({
          bg: k < left ? '#FF9900' : '#E0E7EB',
          radius: k === 0 ? '16px 2px 2px 16px' : (k === 2 ? '2px 16px 16px 2px' : '2px'),
        }));
        return { ...n, delay: delay.toFixed(2), tickDelay: (delay + 0.25).toFixed(2), ok, bad: !ok, status: ok ? ', correct' : ', missed', segs, livesText: left + ' of 3 lives left' };
      }),
      // Crown progress (static stand-in for the crowns Lottie): earned crowns gold, the newly earned one pops in.
      ...crownVals,
      // Accuracy: average of the 4 games' shares (time-outs count as mistakes).
      accuracy: results ? Math.round(p * 100 * acc) + '%' : '[%]',
      time: hasTime ? Math.floor(Math.round(secs * p) / 60) + ':' + String(Math.round(secs * p) % 60).padStart(2, '0') : '[m:ss]',
      language: this.props.language || 'Serbian',
      embedded,
      standalone: !embedded,
      restart: () => { if (embedded) this.props.onRestart(); },
      done: () => { if (typeof this.props.onContinue === 'function') this.props.onContinue(); },
    };
  }
}
</script>
