<!doctype html>
<html lang="{{langTag}}">
<head>
<meta charset="utf-8">
<title>Sentence Snap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{overflow:hidden;overscroll-behavior:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;font-family:'Noto Sans',sans-serif;background:#FFFFFF;color:#29353D}
a{color:#006EB2}a:hover{color:#005E99}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div data-ss-root="1" lang="en" style="width: 402px; height: 874px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; padding: 62px 16px 34px; font-family: 'Noto Sans', sans-serif; color: #29353D; position: relative; overflow: hidden">

  <dc-import name="GymHeader" step="2" done="{{stageDone}}" total="6" lives="{{lives}}" timed="{{timedOn}}" time-total="{{timeTotal}}" paused="{{headerPaused}}" run="{{resets}}" on-tick="{{tick}}" on-close="{{close}}" hint-size="100%,92px"></dc-import>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding-top: 24px">
    <h1 style="margin: 0; font-size: 18px; line-height: 27px; font-weight: 700; color: #29353D">Build the sentence</h1>
    <p style="margin: 6px 0 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 22px; line-height: 32px; font-weight: 600; color: #29353D">{{prompt}} <sc-if value="{{hasContext}}" hint-placeholder-val="{{ true }}"><button onClick="{{openTag}}" aria-label="{{tagAria}}" style="min-height: 32px; padding: 4px 8px 4px 12px; border: 0; border-radius: 999px; background: #F0F3F5; display: inline-flex; align-items: center; gap: 4px; font-family: 'Noto Sans', sans-serif; font-size: 13px; line-height: 20px; font-weight: 600; color: #3D505C; cursor: pointer">{{context}}<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink: 0"><path d="M12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2ZM12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4ZM12 14.75C12.6904 14.75 13.25 15.3096 13.25 16C13.25 16.6904 12.6904 17.25 12 17.25C11.3096 17.25 10.75 16.6904 10.75 16C10.75 15.3096 11.3096 14.75 12 14.75ZM12 6C12.5523 6 13 6.44772 13 7V12C13 12.5523 12.5523 13 12 13C11.4477 13 11 12.5523 11 12V7C11 6.44772 11.4477 6 12 6Z"></path></svg></button></sc-if></p>

    <sc-if value="{{showPattern}}" hint-placeholder-val="{{ true }}">
    <button onClick="{{openPattern}}" aria-label="{{patternAria}}" style="margin-top: 20px; align-self: flex-start; min-height: 32px; padding: 4px 8px 4px 4px; border: 0; border-radius: 999px; background: #F9FAFB; display: flex; align-items: center; gap: 6px; color: #5C788A; cursor: pointer">
      
      <span aria-hidden="true" style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 1.5px {{sLine}} #33B2FF; background: #F5FBFF; color: #006EB2; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">S</span>
      <span aria-hidden="true" style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 1.5px solid #FFAD33; background: #FFEBCC; color: #995C00; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">V</span>
      <span aria-hidden="true" style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 1.5px solid #7DE8A4; background: #E9FBF0; color: #17823E; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">A</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink: 0"><path d="M12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2ZM12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4ZM12 14.75C12.6904 14.75 13.25 15.3096 13.25 16C13.25 16.6904 12.6904 17.25 12 17.25C11.3096 17.25 10.75 16.6904 10.75 16C10.75 15.3096 11.3096 14.75 12 14.75ZM12 6C12.5523 6 13 6.44772 13 7V12C13 12.5523 12.5523 13 12 13C11.4477 13 11 12.5523 11 12V7C11 6.44772 11.4477 6 12 6Z"></path></svg>
    </button>
    </sc-if>

    <div data-zone="answer" style="margin-top: 10px; min-height: 120px; box-sizing: border-box; padding: 12px 0; border-top: 2px solid {{ansLine}}; border-bottom: 2px solid {{ansLine}}; background: {{ansBg}}; display: flex; align-content: flex-start; gap: 10px; flex-wrap: wrap; transition: border-color 0.15s, background 0.15s" lang="{{langTag}}">
      <span class="sr" lang="en">Your sentence</span>
      <sc-for list="{{answer}}" as="w" hint-placeholder-count="2">
        <button data-pos="{{w.pos}}" onClick="{{w.remove}}" onPointerDown="{{w.grab}}" onPointerMove="{{dragMove}}" onPointerUp="{{dragEnd}}" onPointerCancel="{{dragCancel}}" disabled="{{locked}}" aria-label="Remove {{w.t}}" style="position: relative; z-index: {{w.z}}; transform: translate({{w.dx}}px, {{w.dy}}px) scale({{w.scale}}); box-shadow: {{w.shadow}}; transition: {{w.trans}}; touch-action: none; user-select: none; min-height: 48px; padding: 4px 16px; border-radius: 12px; border: 2px solid {{w.border}}; background: {{w.bg}}; color: {{w.ink}}; font-family: 'Noto Sans', sans-serif; font-weight: 600; font-size: 20px; cursor: {{w.cursor}}">{{w.t}}<sc-if value="{{w.hasTr}}" hint-placeholder-val="{{ false }}"><span lang="en" style="display: block; font-size: 12px; line-height: 16px; font-weight: 500; font-style: italic; opacity: 0.8">{{w.tr}}</span></sc-if><sc-if value="{{w.hasRole}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 1.5px solid {{w.roleLine}}; background: {{w.roleBg}}; color: {{w.roleInk}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800">{{w.role}}</span></sc-if><sc-if value="{{w.caret}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: -9px; top: 2px; bottom: 2px; width: 4px; border-radius: 2px; background: #33B2FF"></span></sc-if></button>
      </sc-for>
      <sc-if value="{{endCaret}}" hint-placeholder-val="{{ false }}">
        <span aria-hidden="true" style="width: 4px; height: 48px; border-radius: 2px; background: #33B2FF"></span>
      </sc-if>
    </div>

    <div data-zone="bank" style="margin-top: 32px; padding: 8px 0; border-radius: 12px; background: {{bankBg}}; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; transition: background 0.15s" lang="{{langTag}}">
      <sc-for list="{{bank}}" as="w" hint-placeholder-count="4">
        <button onClick="{{w.add}}" onPointerDown="{{w.grab}}" onPointerMove="{{dragMove}}" onPointerUp="{{dragEnd}}" onPointerCancel="{{dragCancel}}" disabled="{{w.used}}" style="position: relative; z-index: {{w.z}}; transform: translate({{w.dx}}px, {{w.dy}}px) scale({{w.scale}}); box-shadow: {{w.shadow}}; transition: {{w.trans}}; touch-action: none; user-select: none; min-height: 48px; padding: 4px 16px; border-radius: 12px; border: 2px solid {{w.border}}; background: {{w.bg}}; color: {{w.ink}}; font-family: 'Noto Sans', sans-serif; font-weight: 600; font-size: 20px; cursor: {{w.cursor}}">{{w.t}}<sc-if value="{{w.hasTr}}" hint-placeholder-val="{{ false }}"><span lang="en" style="display: block; font-size: 12px; line-height: 16px; font-weight: 500; font-style: italic; opacity: 0.8">{{w.tr}}</span></sc-if></button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{showCheck}}" hint-placeholder-val="{{ true }}">
    <button onClick="{{check}}" disabled="{{checkDisabled}}" style="width: 100%; height: 48px; border: 0; border-radius: 12px; background: {{checkBg}}; color: {{checkInk}}; font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">Check</button>
  </sc-if>
  <sc-if value="{{checked}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="margin: 0 -16px -34px; padding: 20px 16px 34px; border-radius: 20px 20px 0 0; background: {{fb.bg}}; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <sc-if value="{{fb.ok}}" hint-placeholder-val="{{ true }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="{{fb.ink}}" stroke="none"><circle cx="12" cy="12" r="11"></circle><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </sc-if>
        <sc-if value="{{fb.bad}}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="{{fb.ink}}" stroke="none"><circle cx="12" cy="12" r="11"></circle><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg>
        </sc-if>
        <sc-if value="{{fb.clock}}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="{{fb.ink}}" stroke="none"><circle cx="12" cy="12" r="11"></circle><path d="M12 6.5V12l3.5 2.2" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </sc-if>
        <span style="flex-grow: 1; font-size: 20px; font-weight: 800; color: {{fb.ink}}">{{fb.title}}</span>
        <button aria-label="Report a problem" style="width: 44px; height: 44px; margin-right: -10px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: {{fb.ink}}; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>
        </button>
      </div>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: #29353D"><strong style="font-weight: 700">{{fb.answer}}</strong><br><span style="color: #3D505C">{{fb.note}}</span></p>
      <button onClick="{{next}}" style="margin-top: 4px; height: 48px; border-radius: 12px; background: {{fb.btn}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; width: 100%; border: 0; font-family: 'Noto Sans', sans-serif; cursor: pointer">{{nextLabel}}</button>
      <sc-if value="{{canSkip}}" hint-placeholder-val="{{ false }}">
        <button onClick="{{skip}}" style="height: 48px; border-radius: 12px; background: transparent; color: {{fb.ink}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; width: 100%; border: 0; font-family: 'Noto Sans', sans-serif; cursor: pointer">Continue</button>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{timedOn}}" hint-placeholder-val="{{ true }}">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 402px; height: 874px; pointer-events: none">
    <dc-import name="GymTimerRing" time-left="{{timeLeft}}" time-total="{{timeTotal}}" hint-size="402px,874px"></dc-import>
  </div>
  </sc-if>
  <sc-if value="{{infoOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; width: 402px; height: 874px; z-index: 40">
      <dc-import name="GymInfoSheet" title="{{info.title}}" kicker="{{info.kicker}}" body="{{info.body}}" table="{{info.table}}" examples="{{info.examples}}" tips="{{info.tips}}" lang-tag="{{langTag}}" on-close="{{closeInfo}}" hint-size="402px,874px"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onFinish":{"editor":null},"active":{"editor":null},"run":{"editor":null},"onOut":{"editor":null},"onClose":{"editor":null},"paused":{"editor":null},"timed":{"editor":null},"depleted":{"editor":null},"rule":{"editor":null},"item":{"editor":null},"langTag":{"editor":null},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh();
  }
  // A clean start: used on first load, when the Full flow shows this stage, and on Train again.
  fresh() {
    return { ...{ info: null, answer: [], checked: false, misses: 0, drag: null, hover: null, timedOut: false, timeLeft: 60 }, resets: ((this.state && this.state.resets) || 0) + 1 };
  }
  componentDidUpdate(prev) {
    const on = this.props.active !== false;
    const was = prev.active !== false;
    if ((on && !was) || this.props.run !== prev.run) { this.outSent = false; this.setState(this.fresh()); return; }
    // Last life gone: tell the Full flow at once so it can show the failed panel.
    if (on && this.lives === 0 && this.props.depleted !== true && !this.outSent && typeof this.props.onOut === 'function') {
      this.outSent = true;
      this.props.onOut();
    }
  }
  renderVals() {
    // Content comes from the Full flow (one row of the language's Sentence Snap sheet); on its own it plays this Serbian row.
    const item = this.props.item || {
      prompt: 'You are happy.', context: 'to a man', subjectOptional: true,
      tokens: ['si', 'srećan', 'ste', 'ti', 'sam'], roles: ['V', 'A', 'V', 'S', 'V'],
      accepted: ['ti si srećan', 'srećan si'],
      okAnswer: 'Ti si srećan.', okNote: 'Si is “are” for ti. Srećan si also works: tap S V A to see why.',
      badAnswer: 'Answer: Ti si srećan.', badNote: 'Ti takes si. Sam goes with ja, ste with vi.',
      hint: 'Look at the subject: which verb form goes with ti?',
      // Explanations (draft copy, to be proofread by the language team).
      tagInfo: {
        kicker: 'Who you’re talking to', title: 'to a man',
        body: 'Serbian adjectives change to match the person they describe. The tag tells you who “you” is here, so you know which form to use.',
        table: [['', 'happy', ''], ['to a man', 'srećan', 'masculine'], ['to a woman', 'srećna', 'feminine'], ['to a child', 'srećno', 'neuter']],
        examples: [['Ti si srećan.', 'You are happy. (to a man)'], ['Ti si srećna.', 'You are happy. (to a woman)']],
      },
      patternInfo: {
        kicker: 'Sentence pattern', title: 'S + V + A',
        body: 'Put the words in this order: S, the subject (who), then V, the verb biti (to be), then A, the adjective (what they are like).',
        table: [['S', 'subject', 'ti (you)'], ['V', 'verb', 'si (are)'], ['A', 'adjective', 'srećan (happy)']],
        examples: [['Ti si srećan.', 'S + V + A: you are happy.'], ['Srećan si.', 'A + V: same meaning. Si already says “you are”, so ti can be dropped. The adjective then comes first, because si can’t start the sentence.']],
        tips: ['The dashed S means the subject is optional.'],
      },
    };
    const langTag = this.props.langTag || 'sr-Latn';
    const tokens = item.tokens;
    const roles = item.roles;
    const roleStyle = {
      S: { roleLine: '#33B2FF', roleBg: '#F5FBFF', roleInk: '#006EB2' },
      V: { roleLine: '#FFAD33', roleBg: '#FFEBCC', roleInk: '#995C00' },
      A: { roleLine: '#7DE8A4', roleBg: '#E9FBF0', roleInk: '#17823E' },
    };
    const accepted = item.accepted;
    const { answer, checked } = this.state;
    const said = answer.map((i) => tokens[i]).join(item.joiner ?? ' ');
    const timedOut = this.state.timedOut === true;
    const ok = !timedOut && accepted.includes(said);
    // Drag and drop (taps still add and remove): drag a bank word into the sentence at any spot,
    // drag a sentence word to a new spot, or back to the bank to remove it.
    const { drag, hover } = this.state;
    const tapBlocked = () => Date.now() - (this.dragEndAt || 0) < 350;
    const zoneAt = (x, y) => {
      const hits = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [];
      for (const el of hits) {
        if (this.dragEl && this.dragEl.contains(el)) continue;
        const z = el.closest && el.closest('[data-zone]');
        if (z && (!this.root || this.root.contains(z))) return z.getAttribute('data-zone');
      }
      return null;
    };
    // The sentence word the pointer sits before (by its position), or null for the end.
    const beforeAt = (x, y, skip) => {
      const chips = this.root ? [...this.root.querySelectorAll('[data-pos]')] : [];
      for (const c of chips) {
        const p = Number(c.getAttribute('data-pos'));
        if (p === skip) continue;
        const r = c.getBoundingClientRect();
        if (y < r.top || (y <= r.bottom && x < r.left + r.width / 2)) return p;
      }
      return null;
    };
    const grab = (kind, i, pos) => (e) => {
      if (checked || (kind === 'bank' && answer.includes(i))) return;
      const el = e.currentTarget;
      this.dragEl = el;
      this.root = el.closest('[data-ss-root]');
      if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
      this.setState({ drag: { kind, i, pos, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moved: false }, hover: null });
    };
    const dragMove = (e) => {
      const d = this.state.drag;
      if (!d) return;
      const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
      const moved = d.moved || Math.hypot(dx, dy) > 6;
      let h = null;
      if (moved) {
        const zone = zoneAt(e.clientX, e.clientY);
        h = { zone, before: zone === 'answer' ? beforeAt(e.clientX, e.clientY, d.kind === 'ans' ? d.pos : -1) : null };
      }
      this.setState({ drag: { ...d, dx, dy, moved }, hover: h });
    };
    const dragEnd = () => {
      const d = this.state.drag, h = this.state.hover;
      if (!d) return;
      if (d.moved) this.dragEndAt = Date.now();
      const next = { drag: null, hover: null };
      if (d.moved && h && h.zone === 'answer') {
        const rest = d.kind === 'ans' ? answer.filter((_, p) => p !== d.pos) : [...answer];
        let at = rest.length;
        if (h.before !== null) at = rest.indexOf(answer[h.before]);
        rest.splice(at < 0 ? rest.length : at, 0, d.i);
        next.answer = rest;
      } else if (d.moved && h && h.zone === 'bank' && d.kind === 'ans') {
        next.answer = answer.filter((_, p) => p !== d.pos);
      }
      this.dragEl = null;
      this.setState(next);
    };
    const dragCancel = () => { this.dragEl = null; this.setState({ drag: null, hover: null }); };
    const lifted = (on) => (on && drag.moved
      ? { z: 10, dx: drag.dx, dy: drag.dy, scale: 1.06, shadow: '0 12px 28px rgba(31,40,46,0.28)', trans: 'background 0.2s, border-color 0.2s', cursor: 'grabbing' }
      : { z: on ? 10 : 'auto', dx: 0, dy: 0, scale: 1, shadow: 'none', trans: 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s', cursor: checked ? 'default' : 'grab' });
    const overAnswer = !!(drag && drag.moved && hover && hover.zone === 'answer');
    // No marker where the drop would leave the sentence as it is.
    const sameSpot = (before) => drag && drag.kind === 'ans' && (before === drag.pos + 1 || (before === null && drag.pos === answer.length - 1));
    const answerItems = answer.map((i, pos) => {
      let border = '#33B2FF', bg = '#E6F5FF', ink = '#006EB2';
      if (checked) { border = ok ? '#51E186' : '#EF4444'; bg = ok ? '#E9FBF0' : '#FDE8E8'; ink = ok ? '#0F5729' : '#8D0C0C'; }
      return { pos, tr: item.tokTr ? item.tokTr[i] : '', hasTr: !!item.tokTr, hasRole: !!roles[i], t: pos === 0 ? tokens[i].charAt(0).toUpperCase() + tokens[i].slice(1) : tokens[i], role: roles[i], ...roleStyle[roles[i]], border, bg, ink,
        ...lifted(!!(drag && drag.kind === 'ans' && drag.pos === pos)),
        caret: overAnswer && hover.before === pos && !sameSpot(pos),
        grab: grab('ans', i, pos),
        remove: () => { if (tapBlocked()) return; this.setState({ answer: answer.filter((_, p) => p !== pos) }); } };
    });
    const bank = tokens.map((t, i) => {
      const used = answer.includes(i) || checked;
      return {
        t, used, tr: item.tokTr ? item.tokTr[i] : '', hasTr: !!item.tokTr,
        border: answer.includes(i) ? '#F0F3F5' : '#E0E7EB',
        bg: answer.includes(i) ? '#F0F3F5' : '#FFFFFF',
        ink: answer.includes(i) ? '#F0F3F5' : '#29353D',
        ...lifted(!!(drag && drag.kind === 'bank' && drag.i === i)),
        grab: grab('bank', i, -1),
        add: () => { if (tapBlocked() || answer.includes(i)) return; this.setState({ answer: [...answer, i] }); },
      };
    });
    const has = answer.length > 0;
    const fb = ok
      ? { ok: true, bad: false, clock: false, bg: '#E9FBF0', ink: '#17823E', btn: '#1A9848', title: 'Excellent!', answer: item.okAnswer, note: item.okNote }
      : { ok: false, bad: !timedOut, clock: timedOut, bg: '#FEF3F3', ink: '#A40E0E', btn: '#D31212', title: timedOut ? 'Time’s up' : 'Not quite', answer: item.badAnswer, note: item.badNote };
    // After Try again on an out-of-lives game the lives stay at 0 and the game can't score higher.
    const depleted = this.props.depleted === true;
    const lives = depleted ? 0 : Math.max(0, 3 - this.state.misses - (timedOut ? 1 : 0));
    const retry = checked && !ok && !timedOut && (depleted || lives > 0);
    if (retry) { fb.answer = 'Try again'; fb.note = item.hint; }
    this.lives = lives;
    // Each exercise has its own 3 lives. Inside the Full flow the parent passes onFinish; on its own Continue replays this screen.
    const embedded = typeof this.props.onFinish === 'function';
    return {
      // Info sheets (rule, tag, pattern): the timer pauses while one is open.
      infoOpen: !!this.state.info,
      info: this.state.info || {},
      closeInfo: () => this.setState({ info: null }),
      // Train again runs untimed: only the total time is counted on Results.
      timedOn: this.props.timed !== false,
      embedded,
      standalone: !embedded,
      // X in the header: the Full flow takes you back to the Grammar exercises list.
      close: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); },
      // Wrong with lives left: try again (answer stays hidden). Right, timed out or out of lives: move on.
      // Timer (60 s, same as Form Forge and Lane Sort): pauses while answered or while the quit sheet is open; time up costs a life and moves on.
      resets: this.state.resets,
      headerPaused: this.props.active === false || this.props.paused === true || !!this.state.info || this.state.checked === true || this.state.timedOut === true,
      timeTotal: 60,
      timeLeft: this.state.timeLeft,
      tick: (t) => this.setState(t <= 0 ? { timeLeft: 0, checked: true, timedOut: true, drag: null, hover: null } : { timeLeft: t }),
      // Out of lives and practising: Try again as often as you like, or Continue to settle with the mistake and move on.
      canSkip: retry && this.props.depleted === true && typeof this.props.onFinish === 'function',
      skip: () => { if (typeof this.props.onFinish === 'function') this.props.onFinish({ ok: false, lives: 0, correct: 0, mistakes: this.state.misses }); },
      stageDone: checked && !retry,
      nextLabel: retry ? 'Try again' : 'Continue',
      next: () => { if (retry) this.setState({ checked: false, answer: [] }); else if (embedded) this.props.onFinish({ ok: ok, lives, correct: ok ? 1 : 0, mistakes: this.state.misses + (timedOut ? 1 : 0) }); else this.setState(this.fresh()); },
      lives,
      answer: answerItems, bank,
      dragMove, dragEnd, dragCancel,
      endCaret: overAnswer && hover.before === null && !sameSpot(null),
      ansLine: overAnswer ? '#33B2FF' : '#E0E7EB',
      ansBg: overAnswer ? '#F5FBFF' : 'transparent',
      bankBg: drag && drag.moved && drag.kind === 'ans' && hover && hover.zone === 'bank' ? '#F0F3F5' : 'transparent',
      prompt: item.prompt, context: item.context || '', hasContext: !!item.context, langTag,
      sLine: item.subjectOptional ? 'dashed' : 'solid',
      showPattern: !item.noPattern,
      // Tag (e.g. to a man) and S V A pattern open short explanations from the language team.
      openTag: () => this.setState({ info: item.tagInfo || { title: item.context, body: '' } }),
      tagAria: (item.context || '') + '. What does this mean?',
      openPattern: () => this.setState({ info: item.patternInfo || { title: 'Sentence pattern', body: '' } }),
      patternAria: (item.subjectOptional ? 'Pattern: subject (optional), verb, adjective' : 'Pattern: subject, verb, adjective') + '. What does this mean?',
      patternText: item.subjectOptional ? 'Pattern: subject (optional), verb, adjective' : 'Pattern: subject, verb, adjective',
      locked: checked,
      showCheck: !checked, checked,
      checkDisabled: !has,
      checkBg: has ? '#FF9900' : '#E0E7EB',
      checkInk: has ? '#FFFFFF' : '#5C788A',
      check: () => this.setState(accepted.includes(said) ? { checked: true } : { checked: true, misses: this.state.misses + 1 }),
      fb,
    };
  }
}
</script>
