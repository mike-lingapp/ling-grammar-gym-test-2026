<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grammar Gym, learn the rule</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{overflow:hidden;overscroll-behavior:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;font-family:'Noto Sans',sans-serif;background:#FFFFFF;color:#29353D}
a{color:#006EB2}a:hover{color:#005E99}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div style="width: 402px; height: 874px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; padding: 62px 16px 34px; font-family: 'Noto Sans', sans-serif; color: #29353D; position: relative; overflow: hidden">

  <div style="height: 52px; display: flex; align-items: center; gap: 10px">
    <button onClick="{{back}}" aria-label="{{backLabel}}" style="width: 44px; height: 44px; margin-left: -10px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #29353D; cursor: pointer; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div aria-hidden="true" style="flex-grow: 1; display: flex; gap: 6px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
        <span style="flex: 1 1 0; height: 8px; border-radius: 4px; background: {{d.bg}}; transition: background 0.3s"></span>
      </sc-for>
    </div>
    <span class="sr">{{stepText}}</span>
  </div>

  <p style="margin: 18px 0 0; font-size: 14px; line-height: 20px; font-weight: 700; color: #006EB2">{{kicker}}</p>

  <section onPointerDown="{{swipeStart}}" onPointerUp="{{swipeEnd}}" aria-live="polite" style="margin-top: 10px; flex: 1 1 auto; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 20px; border-radius: 20px; border: 2px solid #E0E7EB; background: #FFFFFF; box-shadow: 0 4px 16px rgba(31,40,46,0.06); display: flex; flex-direction: column; gap: 16px; touch-action: pan-y">
    <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 800; color: #29353D">{{card.title}}</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: #3D505C">{{card.body}}</p>

    <sc-if value="{{hasTable}}" hint-placeholder-val="{{ true }}">
      <div role="table" style="display: flex; flex-direction: column; border-radius: 12px; border: 2px solid #F0F3F5; overflow: hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <div role="row" style="display: grid; grid-template-columns: {{cols}}; gap: 10px; padding: 9px 12px; background: {{r.bg}}; border-top: {{r.line}}">
            <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="3">
              <span role="cell" style="font-size: 15px; line-height: 21px; font-weight: {{c.weight}}; color: {{c.ink}}; overflow-wrap: anywhere">{{c.text}}</span>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{hasExamples}}" hint-placeholder-val="{{ false }}">
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{examples}}" as="e" hint-placeholder-count="2">
          <li style="padding: 10px 14px; border-radius: 12px; background: #E6F5FF; display: flex; flex-direction: column; gap: 2px">
            <span lang="{{langTag}}" style="font-size: 17px; line-height: 24px; font-weight: 700; color: #29353D">{{e.target}}</span>
            <sc-if value="{{e.hasTr}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; line-height: 20px; font-style: italic; color: #006EB2">{{e.tr}}</span></sc-if>
            <span style="font-size: 14px; line-height: 20px; color: #3D505C">{{e.english}}</span>
          </li>
        </sc-for>
      </ul>
    </sc-if>

    <sc-if value="{{hasTips}}" hint-placeholder-val="{{ false }}">
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{tips}}" as="t" hint-placeholder-count="2">
          <li style="padding: 10px 14px; border-radius: 12px; background: #FFF5E6; display: flex; align-items: flex-start; gap: 10px">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#995C00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg>
            <span style="font-size: 15px; line-height: 22px; color: #29353D">{{t}}</span>
          </li>
        </sc-for>
      </ul>
    </sc-if>
  </section>

  <button onClick="{{next}}" style="margin-top: 16px; width: 100%; height: 48px; flex-shrink: 0; border: 0; border-radius: 12px; background: #FF9900; color: #FFFFFF; font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">{{nextLabel}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cards":{"editor":null},"language":{"editor":null},"langTag":{"editor":null},"run":{"editor":null},"onDone":{"editor":null},"onBack":{"editor":null},"backTo":{"editor":null},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  // Back on the language picker and forward again: start from the first card.
  componentDidUpdate(prev) {
    if (this.props.run !== prev.run || this.props.cards !== prev.cards) this.setState({ i: 0 });
  }
  renderVals() {
    // 2-3 reading cards from the language's sheet (Full flow); on its own it shows the Serbian set.
    const cards = this.props.cards || SR_CARDS;
    const i = Math.min(this.state.i, cards.length - 1);
    const card = cards[i];
    const last = i === cards.length - 1;
    const language = this.props.language || 'Serbian';
    const table = card.table || [];
    const width = table.reduce((m, r) => Math.max(m, r.length), 0);
    const rows = table.map((r, k) => {
      const head = k === 0 && r[0] === '';
      return {
        bg: head ? '#F9FAFB' : '#FFFFFF',
        line: k === 0 ? '0' : '2px solid #F0F3F5',
        cells: r.map((t, j) => ({ text: t, weight: head || j === 0 ? 700 : 400, ink: head ? '#5C788A' : (j === 0 ? '#29353D' : '#3D505C') })),
      };
    });
    const done = () => { if (typeof this.props.onDone === 'function') this.props.onDone(); };
    const go = (n) => this.setState({ i: Math.max(0, Math.min(cards.length - 1, n)) });
    return {
      card,
      kicker: language + ' grammar' + (card.kicker ? ' · ' + card.kicker : ''),
      langTag: this.props.langTag || 'sr-Latn',
      dots: cards.map((_, k) => ({ bg: k <= i ? '#33B2FF' : '#E0E7EB' })),
      stepText: 'Card ' + (i + 1) + ' of ' + cards.length,
      hasTable: table.length > 0,
      rows,
      cols: width === 2 ? 'minmax(0, 1.2fr) minmax(0, 1fr)' : 'minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr)',
      hasExamples: !!(card.examples && card.examples.length),
      examples: (card.examples || []).map((e) => ({ target: e[0], english: e[1], tr: e[2] || '', hasTr: !!e[2] })),
      hasTips: !!(card.tips && card.tips.length),
      tips: card.tips || [],
      nextLabel: last ? 'Start practice' : 'Next',
      next: () => (last ? done() : go(i + 1)),
      done,
      backLabel: i === 0 ? (this.props.backTo || 'Back to Grammar exercises') : 'Previous card',
      back: () => { if (i > 0) go(i - 1); else if (typeof this.props.onBack === 'function') this.props.onBack(); },
      // Swipe left / right on the card to move between cards.
      swipeStart: (e) => { this.x0 = e.clientX; },
      swipeEnd: (e) => {
        if (this.x0 == null) return;
        const dx = e.clientX - this.x0;
        this.x0 = null;
        if (dx < -50 && !last) go(i + 1);
        if (dx > 50) go(i - 1);
      },
    };
  }
}
const SR_CARDS = [{"title": "One noun, 7 endings", "body": "Serbian nouns change their ending for the job they do in the sentence. These forms are called cases. Here is brat (brother) in all 7:", "table": [["Nominative", "who? what?", "brat"], ["Genitive", "of whom?", "brata"], ["Dative", "to whom?", "bratu"], ["Accusative", "whom? what?", "brata"], ["Vocative", "calling someone", "brate"], ["Instrumental", "with whom?", "bratom"], ["Locative", "about whom? where?", "bratu"]]}, {"title": "Small words choose the case", "body": "The word before the noun usually tells you which case to use.", "table": [["sa (with)", "Instrumental"], ["u / na (where)", "Locative"], ["u / na (where to)", "Accusative"], ["kod, iz, od, bez", "Genitive"], ["ka; pisati, pomagati", "Dative"]], "examples": [["Idem sa dečakom.", "I'm going with the boy."], ["Živim u gradu.", "I live in the city."], ["Idem u školu.", "I'm going to school."]]}, {"title": "Watch out", "body": "A few forms look alike, so read the whole sentence.", "tips": ["u gradu (where) vs u grad (where to): the case changes the meaning.", "People in the accusative look like the genitive: Vidim brata.", "Soft stems take -em: prijateljem, morem.", "k → č in the vocative: dečače."]}];
</script>
</body>
</html>
