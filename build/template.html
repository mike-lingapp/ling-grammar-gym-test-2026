<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ling Wrapped 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Noto+Sans:wght@400;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
:root{--page:#e9eef1;--page-ink:#3d505c;--brand:#f90;--muted:#5c788a;--ink:#3d505c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0d1418;--page-ink:#c5d2da}}
:root[data-theme="dark"]{--page:#0d1418;--page-ink:#c5d2da}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--page-ink);font-family:'Noto Sans',system-ui,sans-serif;overflow:hidden}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:390px;height:844px;flex:none;overflow:hidden;border-radius:44px;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.25),0 0 0 10px #111;transform-origin:center center;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.phone.bare{border-radius:0;box-shadow:none}
.hint{position:fixed;left:16px;right:16px;bottom:10px;text-align:center;font-size:12px;opacity:.7;pointer-events:none}
@media (max-width:520px),(max-height:940px){.hint{display:none}}

/* utility classes used by converted Figma fragments */
img.f{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none}
img.b{display:block;width:100%;height:100%;max-width:none}
.c{position:absolute;transform:translate(-50%,-50%)}
.tx{position:absolute;transform:translateX(-50%)}
.sp{position:absolute;transform:translateX(-50%);display:flex;align-items:center;justify-content:center}
.rot45{flex:none;transform:matrix(.7071067690849304,.7071067690849304,-.7071067690849304,.7071067690849304,0,0)}
.spk{position:relative;border-radius:3.517px;--motion-design-transform:initial;--motion-design-transform-inverse:initial;--motion-layout-transform:translate(0px)}
[data-m]{transform:var(--motion-layout-transform,none)}

/* app screens (entry points) */
.app{position:absolute;inset:0;background:#fff}
.app img.shot{position:absolute;left:0;top:0;width:100%;display:block}
.app .hot{position:absolute;border-radius:16px}
.app .hot:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app[hidden]{display:none}
.floaticon{position:absolute}

/* wrapped container */
.wrapped{position:absolute;inset:0;z-index:10;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);background:#011133}
.wrapped.open{transform:none}
.slide{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s .25s}
.slide.active{opacity:1;visibility:visible;transition:opacity .25s ease}
.slide:not(.run) [data-m]{animation:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;isolation:isolate}
.status{position:relative;height:44px;width:100%;flex:none;color:#fff;z-index:3}
.status .time{position:absolute;left:19.89px;top:14px;width:54px;text-align:center;font:600 15px/18px Inter,system-ui,sans-serif;letter-spacing:-.165px}
.body{flex:1 0 0;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;z-index:2}
.body.center{justify-content:center}
.content{flex:1 0 0;min-height:0;width:100%;display:flex;flex-direction:column;padding-top:24px;overflow:hidden}
.pill{background:#fff;border-radius:384px;padding:8px 16px;display:flex;flex:none}
.topnav{display:flex;flex-direction:column;gap:8px;width:100%;flex:none}
.progress{display:flex;gap:4px;padding:0 16px;height:4px}
.seg{flex:1 0 0;height:4px;border-radius:16px;background:rgba(255,255,255,.35);overflow:hidden;position:relative}
.seg i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;border-radius:16px}
.navrow{position:relative;display:flex;justify-content:center;padding:0 40px}
.iconbtn{position:absolute;left:8px;top:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center}
.iconbtn span{display:flex;padding:8px;border-radius:384px;background:rgba(249,250,251,.08)}
.iconbtn img{width:24px;height:24px;display:block}
.iconbtn:focus-visible span{outline:2px solid #fff}
.cardContainer{flex:1 0 0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;width:100%}
.illus-wrap{width:100%;display:flex;justify-content:center;align-items:center;padding:24px 0;flex:none}
.card{width:358px;min-height:240px;background:#fff;border:1px solid #e0e7eb;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;flex:none}
.card-row{display:flex;gap:8px;width:100%;justify-content:center;align-items:flex-start}
.card-row.bot{align-items:flex-end}
.hole{width:24px;height:24px;flex:none}
.card p{margin:0;flex:1 0 0;text-align:center}
.card-label{font:400 18px/1.6 'Noto Sans',sans-serif;color:var(--muted)}
.card-num{min-height:138px;display:flex;align-items:center;justify-content:center;width:100%}
.card-num p{font:700 72px/1.25 Poppins,sans-serif;color:var(--ink)}
.card-bottom{font:700 20px/1.25 Poppins,sans-serif;color:var(--muted)}
.bottom{width:100%;max-width:540px;display:flex;flex-direction:column;gap:8px;padding:8px 16px 0;align-items:center;flex:none;z-index:4}
.btn{width:100%;min-height:48px;border-radius:16px;padding:8px 16px;font:700 18px/1.5 'Noto Sans',sans-serif;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn-brand{background:var(--brand);color:#fff}
.btn-white{background:#fff;color:var(--muted)}
.home{height:21px;width:100%;position:relative}
.home i{position:absolute;left:calc(50% - .5px);bottom:8px;transform:translateX(-50%);width:139px;height:5px;border-radius:100px;background:#fff}

/* share modal */
.share-modal{position:absolute;inset:0;z-index:30;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);background:#fff}
.share-modal.open{transform:none}
.toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,20px);background:rgba(20,30,38,.92);color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.wrapped,.share-modal,.slide{transition:none}}

/*MOTION*/
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="app" id="app-learn"></div>
    <div class="app" id="app-profile" hidden></div>
    <div class="wrapped" id="wrapped" aria-hidden="true">
<!--SLIDES-->
    </div>
    <div class="share-modal" id="share" aria-hidden="true">
<!--SHARE-->
    </div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<p class="hint">Tap right / left half, swipe, or use ← → keys · Share pauses the timer · Esc closes</p>
<script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.50.0/rive.js"></script>
<template id="floaticon-tpl"><!--FLOATICON--></template>
<script>
(() => {
  const ENTRY = /*ENTRY*/;
  const SHARES = /*SHARES*/;
  const STORY_MS = 30000;
  const phone = document.getElementById('phone');
  const wrapped = document.getElementById('wrapped');
  const shareModal = document.getElementById('share');
  const slides = [...wrapped.querySelectorAll('.slide')];
  const LAST = slides.length - 1;

  /* ---------- Rive animations (looping state machines) ---------- */
  const RIVS = /*RIVS*/;
  // Load the Rive engine from the file published next to this page (CDN downloads are blocked in some hosts).
  if (window.rive) rive.RuntimeLoader.setWasmUrl(new URL('rive.wasm', location.href).href);
  const rivBuf = {};
  function riveBuffer(k) {
    if (!rivBuf[k]) { const b = atob(RIVS[k]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); rivBuf[k] = u.buffer; }
    return rivBuf[k].slice(0);
  }
  const riveInst = new Map();
  function riveFor(canvas) {
    let r = riveInst.get(canvas);
    if (r || !window.rive) return r;
    r = new rive.Rive({
      buffer: riveBuffer(canvas.dataset.riv), canvas, autoplay: true,
      stateMachines: 'State Machine 1', autoBind: true,
      layout: new rive.Layout({ fit: rive.Fit.Cover, alignment: rive.Alignment.Center }),
      onLoad: () => {
        r.resizeDrawingSurfaceToCanvas();
        const vm = canvas.dataset.vm;
        if (vm) { try { const inst = r.viewModelByName('WrappedBackground').instanceByName(vm); if (inst) r.bindViewModelInstance(inst); } catch (e) { console.warn('Rive view model', e); } }
        if (!(isOpen && canvas.closest('.slide') === slides[idx])) r.pause();
      }
    });
    riveInst.set(canvas, r);
    return r;
  }
  function syncRive() {
    slides.forEach((s, n) => s.querySelectorAll('canvas.rive').forEach(c => {
      if (isOpen && n === idx) { const r = riveFor(c); if (r) { r.resizeDrawingSurfaceToCanvas(); r.play(); } }
      else { const r = riveInst.get(c); if (r) r.pause(); }
    }));
  }
  addEventListener('resize', () => riveInst.forEach(r => r.resizeDrawingSurfaceToCanvas()));

  /* ---------- fit the phone to the viewport ---------- */
  function fit() {
    const small = innerWidth <= 520;
    phone.classList.toggle('bare', small);
    const pad = small ? 0 : 48;
    const s = Math.min((innerHeight - pad) / 844, (innerWidth - (small ? 0 : 32)) / 390, small ? 10 : 1);
    phone.style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  /* ---------- entry screens (Learn tab, Profile) ---------- */
  let origin = 'learn';
  function buildApp(name, img) {
    const el = document.getElementById('app-' + name);
    const cfg = ENTRY[name];
    const k = 390 / cfg.w;
    const pos = r => `left:${r.x * k}px;top:${r.y * k}px;width:${r.w * k}px;height:${r.h * k}px`;
    el.innerHTML = `<img class="shot" src="${img}" alt="">`;
    const hot = document.createElement('button');
    hot.className = 'hot'; hot.setAttribute('aria-label', 'Open Ling Wrapped 2026');
    hot.style.cssText = pos(cfg.hotspot);
    hot.addEventListener('click', () => openWrapped(name));
    el.appendChild(hot);
    if (name === 'learn') {
      const tpl = document.getElementById('floaticon-tpl').innerHTML.trim();
      if (tpl) { const f = document.createElement('div'); f.className = 'floaticon'; f.style.cssText = pos(cfg.hotspot) + ';pointer-events:none'; f.innerHTML = tpl; el.insertBefore(f, hot); }
    }
    for (const [tab, r] of Object.entries(cfg.tabs || {})) {
      if (tab === name || !ENTRY[tab]) continue;
      const b = document.createElement('button');
      b.className = 'hot'; b.setAttribute('aria-label', 'Go to ' + tab); b.style.cssText = pos(r);
      b.addEventListener('click', () => showApp(tab));
      el.appendChild(b);
    }
  }
  function showApp(name) {
    for (const n of ['learn', 'profile']) document.getElementById('app-' + n).hidden = n !== name;
  }
  buildApp('learn', 'assets/entry/learn.png');
  buildApp('profile', 'assets/entry/profile.png');

  /* ---------- story state ---------- */
  let idx = 0, elapsed = 0, last = 0, raf = 0, isOpen = false, modalOpen = false;

  function timerRunning() { return isOpen && !modalOpen && idx > 0 && idx < LAST && !document.hidden; }

  function renderProgress() {
    const s = slides[idx];
    s.querySelectorAll('.seg i').forEach((bar, i) => {
      const segSlide = i + 1;
      let w = segSlide < idx ? 1 : segSlide > idx ? 0 : (idx === LAST ? 1 : elapsed / STORY_MS);
      bar.style.width = (Math.min(w, 1) * 100) + '%';
    });
  }
  function tick(t) {
    if (timerRunning()) {
      elapsed += t - last;
      if (elapsed >= STORY_MS) { go(idx + 1); }
    }
    last = t;
    renderProgress();
    raf = requestAnimationFrame(tick);
  }

  function show(i) {
    slides.forEach((s, n) => {
      const on = n === i;
      s.classList.toggle('active', on);
      s.setAttribute('aria-hidden', String(!on));
      s.inert = !on;
      if (on) { s.classList.remove('run'); void s.offsetWidth; s.classList.add('run'); }
      else s.classList.remove('run');
    });
  }
  function go(i) {
    if (i < 0 || i > LAST) return;
    idx = i; elapsed = 0;
    show(idx); renderProgress(); syncRive();
  }
  function openWrapped(from) {
    origin = from; isOpen = true;
    wrapped.classList.add('open'); wrapped.setAttribute('aria-hidden', 'false');
    go(0);
    cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(tick);
  }
  function closeWrapped() {
    if (modalOpen) closeShare();
    isOpen = false;
    syncRive();
    wrapped.classList.remove('open'); wrapped.setAttribute('aria-hidden', 'true');
    showApp(origin);
    setTimeout(() => { if (!isOpen) { cancelAnimationFrame(raf); slides.forEach(s => s.classList.remove('run', 'active')); } }, 400);
  }

  /* ---------- share modal ---------- */
  function openShare() {
    const img = SHARES[slides[idx].dataset.key];
    const prev = shareModal.querySelector('.share-preview');
    if (prev && img) prev.src = document.querySelector(`#share-src [data-k="${slides[idx].dataset.key}"]`)?.src || prev.src;
    modalOpen = true;
    shareModal.classList.add('open'); shareModal.setAttribute('aria-hidden', 'false');
  }
  function closeShare() {
    modalOpen = false;
    shareModal.classList.remove('open'); shareModal.setAttribute('aria-hidden', 'true');
    last = performance.now();
  }
  shareModal.addEventListener('click', e => {
    if (e.target.closest('.share-close')) closeShare();
    else if (e.target.closest('.share-cta')) toast('Opens the native share sheet with this image');
  });

  let toastT;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ---------- gestures ---------- */
  let down = null;
  wrapped.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: Date.now(), btn: e.target.closest('button') }; });
  wrapped.addEventListener('pointerup', e => {
    if (!down || modalOpen) { down = null; return; }
    const scale = phone.getBoundingClientRect().width / 390;
    const dx = (e.clientX - down.x) / scale, dy = (e.clientY - down.y) / scale;
    const wasBtn = down.btn; down = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (idx === 0) return;            // the intro only advances with Start
      if (dx < 0) go(idx + 1); else go(idx - 1);
      return;
    }
    if (wasBtn || Math.abs(dx) > 10 || Math.abs(dy) > 10) return;
    if (idx === 0) return;
    const r = phone.getBoundingClientRect();
    if (e.clientX - r.left < r.width / 2) go(idx - 1); else go(idx + 1);
  });
  wrapped.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.classList.contains('js-start')) go(1);
    else if (b.classList.contains('js-next')) go(idx + 1);
    else if (b.classList.contains('js-share')) openShare();
    else if (b.classList.contains('js-close') || b.classList.contains('js-finish')) closeWrapped();
  });
  addEventListener('keydown', e => {
    if (!isOpen) return;
    if (e.key === 'Escape') { modalOpen ? closeShare() : closeWrapped(); }
    else if (modalOpen) return;
    else if (e.key === 'ArrowRight' && idx > 0) go(idx + 1);
    else if (e.key === 'ArrowLeft' && idx > 0) go(idx - 1);
  });
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
})();
</script>
<div id="share-src" hidden><!--SHAREIMGS--></div>
</body>
</html>
