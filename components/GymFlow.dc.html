<style>
html,body{overflow:hidden;overscroll-behavior:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;font-family:'Noto Sans',sans-serif;background:#FFFFFF;color:#29353D}
a{color:#006EB2}a:hover{color:#005E99}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes ggPop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes ggLift{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-10px) rotate(-14deg)}40%{transform:translateY(0) rotate(0)}60%{transform:translateY(-10px) rotate(14deg)}80%{transform:translateY(0) rotate(0)}}
@keyframes ggPulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.35);opacity:0}}
@keyframes ggFadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes ggBob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-6px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes ggBurst{0%{opacity:1;transform:translate(0,0) scale(.4) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(200deg)}}
@keyframes ggSheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes ggScrimIn{from{opacity:0}to{opacity:1}}
@keyframes ggSheetDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes ggScrimOut{from{opacity:1}to{opacity:0}}
.q-in{animation:ggSheetUp .3s cubic-bezier(.2,.8,.2,1) both}.q-scrim-in{animation:ggScrimIn .2s ease-out both}
.q-out{animation:ggSheetDown .22s ease-in both}.q-scrim-out{animation:ggScrimOut .22s ease-in both}
@media (prefers-reduced-motion: reduce){.gg-anim{animation:none!important;opacity:1!important}}
@media (prefers-reduced-motion: reduce){.q-in,.q-out,.q-scrim-in,.q-scrim-out{animation:none!important}}
</style>
</helmet>
<div style="width: 402px; height: 874px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans', sans-serif; color: #29353D">
  <sc-if value="{{sTab}}" hint-placeholder-val="{{ true }}">
    <dc-import name="ProtoLearn" lang="{{lang}}" gym-crowns="{{crowns}}" on-language="{{toLanguages}}" on-open-gym="{{openFromPath}}" on-review="{{toReview}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{sLang}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoLanguage" selected="{{lang}}" on-pick="{{pickLang}}" on-close="{{toLearnTab}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{sReview}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoReview" on-open-gym="{{toList}}" on-learn="{{toLearnTab}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{sList}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoGymList" lang="{{lang}}" on-back="{{toReview}}" on-pick="{{pickTopic}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{sLearn}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoGrammar" cards="{{grammarCards}}" language="{{languageName}}" lang-tag="{{langTag}}" run="{{run}}" back-to="{{grammarBack}}" on-done="{{toStartScreen}}" on-back="{{grammarBackGo}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{s0}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoStart" language="{{languageName}}" on-start="{{begin}}" on-close="{{closeStart}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{s1}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoFormForge" rule="{{ffRule}}" timed="{{timedRun}}" depleted="{{depleted}}" item="{{ffItem}}" lang-tag="{{ffTag}}" active="{{a1}}" run="{{run}}" on-out="{{outOfLives}}" on-close="{{askQuit}}" paused="{{quit}}" on-finish="{{finish}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoSentenceSnap" rule="{{ssRule}}" timed="{{timedRun}}" depleted="{{depleted}}" item="{{ssItem}}" lang-tag="{{ssTag}}" active="{{a2}}" run="{{run}}" on-out="{{outOfLives}}" on-close="{{askQuit}}" paused="{{quit}}" on-finish="{{finish}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoCaseDial" rule="{{cdRule}}" timed="{{timedRun}}" depleted="{{depleted}}" item="{{item}}" lang-tag="{{langTag}}" spacing="{{spacing}}" active="{{a3}}" run="{{run}}" on-out="{{outOfLives}}" on-close="{{askQuit}}" paused="{{quit}}" on-finish="{{finish}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{s4}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoLaneSort" rule="{{lsRule}}" timed="{{timedRun}}" depleted="{{depleted}}" content="{{laneContent}}" lang-tag="{{langTag}}" active="{{a4}}" run="{{run}}" on-out="{{outOfLives}}" on-close="{{askQuit}}" paused="{{quit}}" on-finish="{{finish}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{s5}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoEarDetective" rule="{{edRule}}" timed="{{timedRun}}" depleted="{{depleted}}" item="{{edItem}}" lang-tag="{{langTag}}" speech-lang="{{speechLang}}" active="{{a5}}" run="{{run}}" on-out="{{outOfLives}}" on-close="{{askQuit}}" paused="{{quit}}" on-finish="{{finish}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{s6}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoVerbMatch" rule="{{vmRule}}" timed="{{timedRun}}" depleted="{{depleted}}" item="{{vmItem}}" lang-tag="{{langTag}}" active="{{a6}}" run="{{run}}" on-out="{{outOfLives}}" on-close="{{askQuit}}" paused="{{quit}}" on-finish="{{finish}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{s7}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoResults" language="{{languageName}}" crowns="{{runCrowns}}" timed="{{timedRun}}" results="{{results}}" seconds="{{seconds}}" on-restart="{{restart}}" on-continue="{{toComplete}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{s8}}" hint-placeholder-val="{{ false }}">
    <dc-import name="ProtoComplete" points="100" on-continue="{{toStart}}" hint-size="402px,874px"></dc-import>
  </sc-if>
  <sc-if value="{{out}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; z-index: 50; width: 402px; height: 874px; background: rgba(61, 80, 92, 0.5); display: flex; flex-direction: column; justify-content: flex-end">
      <div role="alertdialog" aria-modal="true" aria-labelledby="out-title" aria-describedby="out-body" style="box-sizing: border-box; padding: 28px 16px 34px; border-radius: 20px 20px 0 0; background: #FEF3F3; display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div aria-hidden="true" style="height: 40px; box-sizing: border-box; padding: 4px; border-radius: 999px; border: 3px solid #EF4444; background: #FFFFFF; display: flex; align-items: center; gap: 4px">
          <span style="width: 40px; height: 26px; border-radius: 13px 4px 4px 13px; background: #F0F3F5"></span>
          <span style="width: 40px; height: 26px; border-radius: 4px; background: #F0F3F5"></span>
          <span style="width: 40px; height: 26px; border-radius: 4px 13px 13px 4px; background: #F0F3F5"></span>
        </div>
        <h2 id="out-title" style="margin: 4px 0 0; font-size: 24px; line-height: 32px; font-weight: 800; color: #A40E0E; text-align: center">Out of lives</h2>
        <p id="out-body" style="margin: 0; font-size: 16px; line-height: 24px; color: #3D505C; text-align: center">You used all 3 lives on this exercise. Try again to practise it (your lives stay empty, so it won’t score higher), or continue to the next exercise.</p>
        <button onClick="{{retryStage}}" style="margin-top: 10px; width: 100%; height: 48px; border: 0; border-radius: 12px; background: #D31212; color: #FFFFFF; font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">Try again</button>
        <button onClick="{{skipOn}}" style="width: 100%; height: 48px; box-sizing: border-box; border: 2px solid #D31212; border-radius: 12px; background: transparent; color: #A40E0E; font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">Continue</button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ps}}" hint-placeholder-val="{{ false }}">
    <div class="{{psScrimCls}}" onClick="{{psScrimTap}}" style="position: absolute; left: 0; top: 0; z-index: 60; width: 402px; height: 874px; background: rgba(61, 80, 92, 0.5); display: flex; flex-direction: column; justify-content: flex-end">
      <div class="{{psSheetCls}}" role="dialog" aria-modal="true" aria-label="Start Grammar exercise" style="background: #FFFFFF; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; transform: translateY({{psDragY}}px); transition: {{psTrans}}">
        <div onPointerDown="{{psGrab}}" onPointerMove="{{psMove}}" onPointerUp="{{psRelease}}" onPointerCancel="{{psRelease}}" style="touch-action: none; user-select: none; cursor: grab">
          <div aria-hidden="true" style="height: 16px; display: flex; justify-content: center"><span style="margin-top: 8px; width: 32px; height: 4px; border-radius: 4px; background: #E0E7EB"></span></div>
        </div>
        <div style="padding: 8px 16px 16px">
          <div style="box-sizing: border-box; min-height: 110px; padding: 16px; border-radius: 16px; background: #F9FAFB; border: 1px solid #F0F3F5; display: flex; align-items: center; gap: 16px">
            <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 32px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
              <svg width="40" height="40" viewBox="0 0 40 40" fill="#19A9FF"><path d="M24.9 18.6C25.9 17.3 27.9 18.0 27.9 19.6V25.4H31.3C32.6 25.4 33.4 27.0 32.6 28.1L26.0 37.3C25.0 38.6 23.0 37.9 23.0 36.3V30.5H19.6C18.3 30.5 17.5 28.9 18.3 27.8L24.9 18.6ZM15.6 15C17.5 15.0 18.9 16.4 19 18.3V21.6C19 21.7 18.9 21.7 18.9 21.8L15.9 26.0C14.8 27.4 14.7 29.1 15.3 30.5C15.0 30.7 14.7 30.9 14.4 31.1C13.3 31.6 12.1 31.9 10.9 32C10.0 31.9 9.4 31.2 9.4 30.3C9.4 29.8 9.6 29.3 9.9 29.0C11.1 28.0 12.0 26.6 12.2 25H10.3C8.4 24.9 7.0 23.5 7 21.6V18.3C7.0 16.4 8.4 15.0 10.3 15H15.6ZM15.6 2C17.5 2.0 18.9 3.4 19 5.3V8.6C18.9 10.5 17.5 11.9 15.6 12H10.3C8.4 11.9 7.0 10.5 7 8.6V5.3C7.0 3.4 8.4 2.0 10.3 2H15.6Z"></path></svg>
            </span>
            <span style="display: flex; flex-direction: column; gap: 2px; align-self: flex-start; padding-top: 2px">
              <span style="font-size: 14px; line-height: 1.35; color: #5C788A">{{psUnit}}</span>
              <span style="font-size: 16px; line-height: 1.35; font-weight: 700; color: #3D505C">Grammar exercise</span>
            </span>
          </div>
        </div>
        <div style="padding: 16px 16px 34px">
          <button onClick="{{psStart}}" style="width: 100%; min-height: 48px; box-sizing: border-box; padding: 8px 16px; border: 0; border-radius: 16px; background: #FF9900; color: #FFFFFF; font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.5; cursor: pointer">Start</button>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{quit}}" hint-placeholder-val="{{ false }}">
    <div class="{{qScrimCls}}" onClick="{{scrimTap}}" style="position: absolute; left: 0; top: 0; z-index: 60; width: 402px; height: 874px; background: rgba(61, 80, 92, 0.5); display: flex; flex-direction: column; justify-content: flex-end">
      <div class="{{qSheetCls}}" role="alertdialog" aria-modal="true" aria-labelledby="quit-title" aria-describedby="quit-body" style="background: #FFFFFF; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; transform: translateY({{qDragY}}px); transition: {{qTrans}}">
        <div onPointerDown="{{qGrab}}" onPointerMove="{{qMove}}" onPointerUp="{{qRelease}}" onPointerCancel="{{qRelease}}" style="touch-action: none; user-select: none; cursor: grab">
          <div aria-hidden="true" style="height: 16px; display: flex; justify-content: center"><span style="margin-top: 8px; width: 32px; height: 4px; border-radius: 4px; background: #E0E7EB"></span></div>
          <div style="min-height: 56px; box-sizing: border-box; padding: 8px 16px; display: flex; align-items: center">
            <h2 id="quit-title" style="margin: 0; font-family: 'Poppins', sans-serif; font-size: 18px; line-height: 1.5; font-weight: 700; color: #3D505C">Quit exercise</h2>
          </div>
        </div>
        <p id="quit-body" style="margin: 0; padding: 0 16px 16px; font-size: 16px; line-height: 1.35; color: #3D505C">Are you sure? You will lose all your progress on this exercise.</p>
        <div style="padding: 16px 16px 34px; display: flex; flex-direction: column; gap: 8px">
          <button onClick="{{confirmQuit}}" style="width: 100%; min-height: 48px; box-sizing: border-box; padding: 8px 16px; border: 0; border-radius: 16px; background: #FF9900; color: #FFFFFF; font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.5; cursor: pointer">Quit</button>
          <button onClick="{{cancelQuit}}" style="width: 100%; min-height: 48px; box-sizing: border-box; padding: 8px 16px; border: 0; border-radius: 16px; background: transparent; color: #5C788A; font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.5; cursor: pointer">Cancel</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
// Case Dial content per language, from the language team's Grammar Gym sheets (Exercises tab).
// Each row: sentence around the gap, English prompt, wheel tiles [form, case label] in that language's case order,
// c = index of the right tile, full answer and feedback.
const CASE_DIAL = {"sr":{"tag":"sr-Latn","items":[{"id":"SR-CD-001","before":"Idem sa","after":".","prompt":"I'm going with the boy.","tiles":[["dečak","Nominative"],["dečaka","Genitive / Accusative"],["dečaku","Dative / Locative"],["dečače","Vocative"],["dečakom","Instrumental"]],"c":4,"full":"Idem sa dečakom.","fb":"Sa (with) takes the instrumental: dečakom."},{"id":"SR-CD-002","before":"Idem sa","after":".","prompt":"I'm going with my brother.","tiles":[["brat","Nominative"],["brata","Genitive / Accusative"],["bratu","Dative / Locative"],["brate","Vocative"],["bratom","Instrumental"]],"c":4,"full":"Idem sa bratom.","fb":"Sa (with) takes the instrumental: bratom."},{"id":"SR-CD-003","before":"Pišem","after":".","prompt":"I write with a pencil.","tiles":[["olovka","Nominative"],["olovke","Genitive"],["olovci","Dative / Locative"],["olovku","Accusative"],["olovko","Vocative"],["olovkom","Instrumental"]],"c":5,"full":"Pišem olovkom.","fb":"The tool you use takes the instrumental: olovkom."},{"id":"SR-CD-004","before":"Putujem","after":".","prompt":"I travel by train.","tiles":[["voz","Nominative / Accusative"],["voza","Genitive"],["vozu","Dative / Locative"],["voze","Vocative"],["vozom","Instrumental"]],"c":4,"full":"Putujem vozom.","fb":"Travelling by something takes the instrumental: vozom."},{"id":"SR-CD-005","before":"Idem na posao","after":".","prompt":"I go to work by bus.","tiles":[["autobus","Nominative / Accusative"],["autobusa","Genitive"],["autobusu","Dative / Locative"],["autobuse","Vocative"],["autobusom","Instrumental"]],"c":4,"full":"Idem na posao autobusom.","fb":"Travelling by something takes the instrumental: autobusom."},{"id":"SR-CD-006","before":"Pijem kafu sa","after":".","prompt":"I drink coffee with milk.","tiles":[["mleko","Nominative / Accusative / Vocative"],["mleka","Genitive"],["mleku","Dative / Locative"],["mlekom","Instrumental"]],"c":3,"full":"Pijem kafu sa mlekom.","fb":"Sa (with) takes the instrumental: mlekom."},{"id":"SR-CD-007","before":"Pričam sa","after":".","prompt":"I'm talking with the professor.","tiles":[["profesor","Nominative"],["profesora","Genitive / Accusative"],["profesoru","Dative / Locative"],["profesore","Vocative"],["profesorom","Instrumental"]],"c":4,"full":"Pričam sa profesorom.","fb":"Sa (with) takes the instrumental: profesorom."},{"id":"SR-CD-008","before":"Živim sa","after":".","prompt":"I live with a friend.","tiles":[["prijatelj","Nominative"],["prijatelja","Genitive / Accusative"],["prijatelju","Dative / Vocative / Locative"],["prijateljem","Instrumental"]],"c":3,"full":"Živim sa prijateljem.","fb":"Sa (with) takes the instrumental: prijateljem."},{"id":"SR-CD-009","before":"Idem u bioskop sa","after":".","prompt":"I'm going to the cinema with my sister.","tiles":[["sestra","Nominative"],["sestre","Genitive"],["sestri","Dative / Locative"],["sestru","Accusative"],["sestro","Vocative"],["sestrom","Instrumental"]],"c":5,"full":"Idem u bioskop sa sestrom.","fb":"Sa (with) takes the instrumental: sestrom."},{"id":"SR-CD-010","before":"Živim u","after":".","prompt":"I live in the city.","tiles":[["grad","Nominative / Accusative"],["grada","Genitive"],["gradu","Dative / Locative"],["grade","Vocative"],["gradom","Instrumental"]],"c":2,"full":"Živim u gradu.","fb":"U (in) for where something is takes the locative: gradu. For grad, the locative looks the same as the dative."},{"id":"SR-CD-011","before":"Knjiga je na","after":".","prompt":"The book is on the table.","tiles":[["sto","Nominative / Accusative"],["stola","Genitive"],["stolu","Dative / Locative"],["stole","Vocative"],["stolom","Instrumental"]],"c":2,"full":"Knjiga je na stolu.","fb":"Na (on) for where something is takes the locative: stolu. For sto, the locative looks the same as the dative."},{"id":"SR-CD-012","before":"Radim u","after":".","prompt":"I work at a school.","tiles":[["škola","Nominative"],["škole","Genitive"],["školi","Dative / Locative"],["školu","Accusative"],["školo","Vocative"],["školom","Instru     const closeSheet = () => { if (this.state.psClosing) return; this.setState({ psClosing: true }); setTimeout(() => this.setState({ ps: false, psClosing: false, psDrag: 0 }), 220); };
    // Accuracy: each of the 6 games is worth a sixth. A game's share = right / (right + mistakes);
    // Lane Sort's share is split over its 6 nouns (right first time / 6). Time never counts.
    const accuracyOf = (res) => {
      const score = (r) => {
        if (!r) return 0;
        if (r.total) return Math.max(0, Math.min(1, (r.correct || 0) / r.total));
        const c = r.correct || 0, m = r.mistakes || 0;
        return c + m > 0 ? c / (c + m) : 0;
      };
      return res.length ? res.reduce((n, r) => n + score(r), 0) / 6 : 0;
    };
    // Crowns follow accuracy, as in Ling lessons: 3 for all or most right (80%+), 2 for at least half, 1 below that.
    const crownsFor = (acc) => (acc >= 0.8 ? 3 : (acc >= 0.5 ? 2 : 1));
    // The Learn tab keeps the best crowns per course language.
    const crowns = (this.state.crowns && this.state.crowns[lang]) || 0;
    const crownUp = (res) => {
      const got = crownsFor(accuracyOf(res));
      return { runCrowns: got, crowns: { ...(this.state.crowns || {}), [lang]: Math.max(crowns, got) } };
    };
    const rules = GRAMMAR[lang] || [];
    const ruleIdx = RULE_FOR[lang] || {};
    return {
      sTab: step === 'tab', s7: step === 7, s8: step === 8, crowns, runCrowns: this.state.runCrowns || 1, timedRun: this.state.timedRun !== false, depleted: !!this.state.depleted,
      ffRule: rules[ruleIdx.ff] || null, ssRule: rules[ruleIdx.ss] || null, cdRule: rules[ruleIdx.cd] || null, lsRule: rules[ruleIdx.ls] || null, edRule: rules[ruleIdx.ed] || null, vmRule: rules[ruleIdx.vm] || null,
      edItem: EAR_DETECTIVE[lang] || null, vmItem: VERB_MATCH[lang] || null, speechLang: SPEECH_LANG[lang] || 'sr-RS', sLang: step === 'lang', sReview: step === 'review', sList: step === 'list', sLearn: step === 'learn', s0: step === 0, s1: step === 1, s2: step === 2, s3: step === 3, s4: step === 4, s5: step === 5, s6: step === 6,
      results, seconds, run, lives, out,
      spacing: CASE_DIAL[lang].joinGap ? 'join' : (CASE_DIAL[lang].spaceAfter ? 'after' : 'normal'),
      ffItem: FORM_FORGE[lang] || null, ffTag: FORM_FORGE[lang] ? CASE_DIAL[lang].tag : 'sr-Latn',
      ssItem: SENTENCE_SNAP[lang] || null, ssTag: SENTENCE_SNAP[lang] ? CASE_DIAL[lang].tag : 'sr-Latn',
      laneContent, lang, item, langTag: CASE_DIAL[lang].tag, languageName: LANG_NAMES[lang],
      grammarCards: GRAMMAR[lang],
      // Entries: Learn tab path tile > start sheet > Learn the rule > Start (back to Learn tab), or Review tab > Grammar Gym list > a topic > Learn the rule > Start > exercises > Results > Review tab.
      // The course language comes from the Learn tab flag (language picker); every unlocked topic plays that language's content for now.
      toStartScreen: () => this.setState({ step: 0, out: false }),
      toReview: () => this.setState({ step: 'review', out: false }),
      toLearnTab: () => this.setState({ step: 'tab', out: false }),
      // Learn tab flag > language picker > back to the Learn tab in the new course; all exercise content follows the language.
      toLanguages: () => this.setState({ step: 'lang', out: false }),
      pickLang: (id) => this.setState({ lang: id, step: 'tab', item: null, laneContent: null, results: [], run: this.state.run + 1, out: false }),
      // Review tab > Grammar exercises list: closing later returns to the list.
      toList: () => this.setState({ step: 'list', origin: 'review', out: false }),
      // Learn tab path tile: straight to P0 Start for this unit; closing returns to the Learn tab.
      // Learn tab path tile: confirmation sheet first; Start goes to P0 Start, closing later returns to the Learn tab.
      openFromPath: () => { this.setState({ ps: true, psClosing: false, psDrag: 0, psEntered: false }); setTimeout(() => this.setState({ psEntered: true }), 320); },
      psStart: () => this.setState({ ps: false, psClosing: false, psDrag: 0, step: 'learn', origin: 'tab', topic: 'biti', results: [], run: this.state.run + 1, out: false }),
      ps: !!this.state.ps,
      psUnit: 'Getting started',
      psScrimTap: (e) => { if (e.target === e.currentTarget) closeSheet(); },
      psSheetCls: this.state.psClosing && !this.state.psDrag ? 'q-out' : (this.state.psEntered ? '' : 'q-in'),
      psScrimCls: this.state.psClosing ? 'q-scrim-out' : 'q-scrim-in',
      psDragY: this.state.psDrag || 0,
      psTrans: this.state.psDragging ? 'none' : 'transform 0.22s ease-out',
      psGrab: (e) => { if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); this.psY0 = e.clientY; this.setState({ psDragging: true }); },
      psMove: (e) => { if (this.psY0 == null) return; this.setState({ psDrag: Math.max(0, e.clientY - this.psY0) }); },
      psRelease: () => {
        if (this.psY0 == null) return;
        this.psY0 = null;
        if ((this.state.psDrag || 0) > 80) { this.setState({ psDragging: false, psClosing: true, psDrag: 520 }); setTimeout(() => this.setState({ ps: false, psClosing: false, psDrag: 0 }), 220); }
        else this.setState({ psDragging: false, psDrag: 0 });
      },
      closeStart: () => this.setState({ step: this.state.origin === 'tab' ? 'tab' : 'list', out: false }),
      // X during an exercise: confirm first with the Quit exercise sheet (Ling App Layouts); the clock pauses meanwhile.
      quit: !!this.state.quit,
      askQuit: () => { this.setState({ quit: true, qClosing: false, qDrag: 0, qEntered: false }); setTimeout(() => this.setState({ qEntered: true }), 320); },
      // Dismiss: slide the sheet down, then close. Tapping the scrim or dragging the handle down past 80px does the same.
      cancelQuit: () => { if (this.state.qClosing) return; this.setState({ qClosing: true }); setTimeout(() => this.setState({ quit: false, qClosing: false, qDrag: 0 }), 220); },
      scrimTap: (e) => { if (e.target === e.currentTarget) { if (this.state.qClosing) return; this.setState({ qClosing: true }); setTimeout(() => this.setState({ quit: false, qClosing: false, qDrag: 0 }), 220); } },
      qScrimCls: this.state.qClosing ? 'q-scrim-out' : 'q-scrim-in',
      qSheetCls: this.state.qClosing && !this.state.qDrag ? 'q-out' : (this.state.qEntered ? '' : 'q-in'),
      qDragY: this.state.qDrag || 0,
      qTrans: this.state.qDragging ? 'none' : 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)',
      qGrab: (e) => { if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); this.qY0 = e.clientY; this.setState({ qDragging: true }); },
      qMove: (e) => { if (this.qY0 == null) return; this.setState({ qDrag: Math.max(0, e.clientY - this.qY0) }); },
      qRelease: () => {
        if (this.qY0 == null) return;
        this.qY0 = null;
        if ((this.state.qDrag || 0) > 80) { this.setState({ qDragging: false, qClosing: true, qDrag: 520 }); setTimeout(() => this.setState({ quit: false, qClosing: false, qDrag: 0 }), 220); }
        else this.setState({ qDragging: false, qDrag: 0 });
      },
      confirmQuit: () => this.setState({ quit: false, out: false, depleted: false, step: this.state.origin === 'tab' ? 'tab' : 'list', results: [], run: this.state.run + 1 }),
      // Learn the rule: back goes to wherever the learner came from (Learn tab path or the Grammar exercises list).
      grammarBack: this.state.origin === 'tab' ? 'Back to Learn' : 'Back to Grammar exercises',
      grammarBackGo: () => this.setState({ step: this.state.origin === 'tab' ? 'tab' : 'list', out: false }),
      pickTopic: (id) => this.setState({ topic: id, step: 'learn', run: this.state.run + 1 }),
      // While the failed panel is up the stage underneath stops (timer paused).
      a1: step === 1 && !out, a2: step === 2 && !out, a3: step === 3 && !out, a4: step === 4 && !out, a5: step === 5 && !out, a6: step === 6 && !out,
      outOfLives: () => { if (!this.state.out) this.setState({ out: true }); },
      // Continue past a failed exercise: it counts as missed with 0 lives, then the next stage (or results) opens.
      // Try again on the failed panel: replay only this exercise (fresh answers, lives and clock), keep the run.
      // Try again after losing all lives: the game restarts with the lives still empty.
      retryStage: () => this.setState({ out: false, depleted: true, run: this.state.run + 1 }),
      skipOn: () => {
        const last = this.state.step === 6;
        this.setState({
          out: false, depleted: false,
          results: [...this.state.results, { ok: false, lives: 0, correct: 0, mistakes: 3 }],
          step: this.state.step + 1,
          seconds: last ? Math.round((Date.now() - startedAt) / 1000) : this.state.seconds,
          ...(last ? crownUp([...this.state.results, { correct: 0, mistakes: 3 }]) : {}),
        });
      },
      finish: (r) => {
        // A game finished after Try again on 0 lives counts as failed: its 3 lost lives stay as mistakes, nothing is scored right.
        const res = this.state.depleted ? { ...(r || {}), ok: false, lives: 0, correct: 0, mistakes: 3 + ((r && r.mistakes) || 0) } : (r || { ok: false, correct: 0, mistakes: 1 });
        const next = [...this.state.results, res];
        const last = this.state.step === 6;
        this.setState({
          results: next, depleted: false,
          step: this.state.step + 1,
          seconds: last ? Math.round((Date.now() - startedAt) / 1000) : this.state.seconds,
          ...(last ? crownUp(next) : {}),
        });
      },
      // Train again: wipe the run and bump run so every stage clears its answers and timer.
      // Start screen: Start workout begins a fresh run; results Continue comes back here.
      begin: () => this.setState({ timedRun: true, depleted: false, item: pickItem(lang), laneContent: dealNouns(lang), step: 1, results: [], startedAt: Date.now(), seconds: 0, run: this.state.run + 1, lives: 3, out: false }),
      // Results Continue goes back to the Review tab.
      // Results Continue: the Grammar Gym complete screen (banana points), then back to where the learner started.
      toComplete: () => this.setState({ step: 8 }),
      toStart: () => this.setState({ step: this.state.origin === 'tab' ? 'tab' : 'review', results: [], seconds: 0, run: this.state.run + 1, lives: 3, out: false }),
      // Train again: same games without the per-game timers; only the total time is shown on Results.
      restart: () => this.setState({ timedRun: false, depleted: false, item: pickItem(lang), laneContent: dealNouns(lang), step: 1, results: [], startedAt: Date.now(), seconds: 0, run: this.state.run + 1, lives: 3, out: false }),
    };
  }
}
</script>
