const GYMS = [{"id": "SR-GYM01", "afterUnit": 2, "unit": "Unit 2: Basic Sentences", "topic": "Personal pronouns (ja, ti, on, ona…)", "cards": [{"id": "SR-GYM01-S1", "title": "Talking about people with personal pronouns", "body": "Personal pronouns are words we use to talk about ourselves and other people, just like \"I\", \"you\", \"he\" and \"she\" in English.", "table": [["'ja'", "I (when talking about yourself)"], ["'ti'", "you (when talking to one person)"], ["'on'", "he (for a man or boy)"], ["'ona'", "she (for a woman or girl)"], ["'ono'", "it (used with 'dete' (child), because 'dete' is a neuter noun in Serbian)"]], "example": ["'Ja sam Meri. Dobro sam. A ti?'", "I'm Mary. I'm good. And you?"], "tips": []}, {"id": "SR-GYM01-S2", "title": "More than one: 'mi', 'vi', 'oni', 'one', 'ona'", "body": "To talk about more than one, look at who or what is in the group. Serbian has three words for \"they\".", "table": [["'mi'", "we (a group with you in it: 'Ana i ja' = Ana and I)"], ["'vi'", "you (when you talk to two or more people: 'ti i Tom' = you and Tom)"], ["'oni'", "they (men, or men and women: 'Tom i Ana')"], ["'one'", "they (only women: 'Ana i Meri')"], ["'ona'", "they (more than one \"it\" word, neuter)"]], "example": ["'Tom i Ana' → 'oni'. 'Ana i Meri' → 'one'.", "Tom and Ana → they. Ana and Meri → they (only women)."], "tips": ["Careful: 'ona' has two meanings: \"she\" for one woman, and \"they\" for more than one \"it\" word.", "The word 'i' means \"and\".", "'Vi' is also a polite way to say \"you\" to one person, like a teacher: 'Kako ste Vi?' = How are you?"]}], "ff": [{"id": "SR-GYM01-S1-01", "mode": "whole_word", "sentence": "Da, ___ sam Meri.", "translation": "Yes, I am Meri.", "stem": "", "after": "", "correct": "ja", "options": ["ja", "ti", "on", "ona"], "full": "Da, ja sam Meri.", "meaning": "Yes, I am Meri.", "feedback": "Talking about yourself → 'ja'."}, {"id": "SR-GYM01-S1-02", "mode": "whole_word", "sentence": "Dobro sam. A ___?", "translation": "I'm good. How about you?", "stem": "", "after": "", "correct": "ti", "options": ["ti", "ja", "on", "ona"], "full": "Dobro sam. A ti?", "meaning": "I'm good. How about you?", "feedback": "You ask the person you talk to → 'ti'."}, {"id": "SR-GYM01-S1-03", "mode": "whole_word", "sentence": "Ćao, da li si ___ Tom?", "translation": "Hi, are you Tom?", "stem": "", "after": "", "correct": "ti", "options": ["ti", "ja", "on", "ona"], "full": "Ćao, da li si ti Tom?", "meaning": "Hi, are you Tom?", "feedback": "One person you talk to → 'ti'."}, {"id": "SR-GYM01-S1-04", "mode": "whole_word", "sentence": "___ sam učiteljica.", "translation": "I am a teacher.", "stem": "", "after": "", "correct": "ja", "options": ["ja", "ti", "on", "ona"], "full": "Ja sam učiteljica.", "meaning": "I am a teacher.", "feedback": "Talking about yourself → 'ja'."}, {"id": "SR-GYM01-S1-05", "mode": "whole_word", "sentence": "Ovo je Ana. ___ je moja prijateljica.", "translation": "This is Ana. She is my friend.", "stem": "", "after": "", "correct": "ona", "options": ["ona", "ja", "ti", "on"], "full": "Ovo je Ana. Ona je moja prijateljica.", "meaning": "This is Ana. She is my friend.", "feedback": "Ana is a woman → 'ona'."}, {"id": "SR-GYM01-S1-06", "mode": "whole_word", "sentence": "Ovo je Tom. ___ je učitelj.", "translation": "This is Tom. He is a teacher.", "stem": "", "after": "", "correct": "on", "options": ["on", "ja", "ti", "ona"], "full": "Ovo je Tom. On je učitelj.", "meaning": "This is Tom. He is a teacher.", "feedback": "Tom is a man → 'on'."}], "lanes": [["mi", "I'm in the group"], ["vi", "you're in it, I'm not"], ["oni", "neither of us"]], "ls": [{"id": "SR-GYM01-S2-01", "word": "Ana i ja", "en": "Ana and I", "lane": 0, "feedback": "I'm in the group → 'mi'."}, {"id": "SR-GYM01-S2-02", "word": "Tom i ja", "en": "Tom and I", "lane": 0, "feedback": "I'm in the group → 'mi'."}, {"id": "SR-GYM01-S2-03", "word": "ti i Ana", "en": "you and Ana", "lane": 1, "feedback": "You're in the group, I'm not → 'vi'."}, {"id": "SR-GYM01-S2-04", "word": "ti i Tom", "en": "you and Tom", "lane": 1, "feedback": "You're in the group, I'm not → 'vi'."}, {"id": "SR-GYM01-S2-05", "word": "Tom i Ana", "en": "Tom and Ana", "lane": 2, "feedback": "Neither you nor I are in the group → 'oni'."}, {"id": "SR-GYM01-S2-06", "word": "Tom i Meri", "en": "Tom and Meri", "lane": 2, "feedback": "Neither you nor I are in the group → 'oni'."}]}, {"id": "SR-GYM02", "afterUnit": 4, "unit": "Unit 4: Likes and daily life", "topic": "The verb biti (to be)", "cards": [{"id": "SR-GYM02-S1", "title": "'biti': I am, you are, he is…", "body": "In Serbian, 'biti' means \"to be.\" Just like in English, the verb changes depending on who you're talking about. For example, English uses \"I am\", \"you are\", \"he is\". Serbian works the same way, and each person has a different form.", "table": [["'ja sam'", "I am"], ["'ti si'", "you are"], ["'on / ona / ono je'", "he / she / it is"], ["'mi smo'", "we are"], ["'vi ste'", "you are (more people, or polite)"], ["'oni / one / ona su'", "they are"]], "example": ["'Ja sam iz Nemačke.'", "I am from Germany."], "tips": ["'Vi ste' (you are) works for one person you are polite to and for a group."]}, {"id": "SR-GYM02-S2", "title": "You don't always need 'ja'", "body": "In Serbian, the verb itself already tells you who it is, so you can leave out the personal pronoun. Then 'sam', 'si', 'je' forms move to second place, after the first word, and never begin the sentence.", "table": [["'Ja sam dobro.' → 'Dobro sam.'", "I'm good."], ["'Ja sam bolestan.' → 'Bolestan sam.'", "I'm sick."], ["'Mi smo odavde.' → 'Odavde smo.'", "We are from here."], ["'Sam dobro.' (not correct: 'biti' can't come first)"]], "example": ["'Dobro sam. A ti?'", "I'm good. How about you?"], "tips": ["You already know 'Dobro sam' (I'm good) from Unit 1. There is no 'ja', because 'sam' already means \"I am\"."]}], "ff": [{"id": "SR-GYM02-S1-01", "mode": "whole_word", "sentence": "Ja ___ kod kuće.", class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Test and app modes both start on the Learn tab now (Figma navigation).
    this.state = { showDesc: true, settingsOpen: false, step: 'tab', origin: 'tab', timedRun: true, lang: 'sr', gym: 'SR-GYM01', done: {}, results: [], startedAt: Date.now(), seconds: 0, run: 1 };
  }
  renderVals() {
    const { step, results, startedAt, seconds, run, lang } = this.state;
    const gym = GYMS.find((g) => g.id === this.state.gym) || GYMS[0];
    const back = () => (this.state.origin === 'list' ? 'list' : 'tab');
    // Lane Sort split: round 1 takes one card per lane first (in sheet order), round 2 the rest.
    const split = (() => {
      const a = [], used = new Set();
      gym.lanes.forEach((_, li) => { const k = gym.ls.findIndex((c, i) => c.lane === li && !used.has(i)); if (k >= 0) { a.push(k); used.add(k); } });
      gym.ls.forEach((c, i) => { if (a.length < Math.ceil(gym.ls.length / 2) && !used.has(i)) { a.push(i); used.add(i); } });
      return [a, gym.ls.map((_, i) => i).filter((i) => !used.has(i))];
    })();
    const s2 = gym.cards[1];
    const lsContent = (ids) => ({ lanes: gym.lanes, rule: (s2.tips && s2.tips[0]) || s2.body, nouns: ids.map((i) => [gym.ls[i].word, gym.ls[i].en, gym.ls[i].lane]) });
    const info = (c) => ({ kicker: gym.topic, title: c.title, body: c.body, table: c.table, examples: c.example && c.example[0] ? [c.example] : [], tips: c.tips || [] });
    const half = Math.ceil(gym.ff.length / 2);
    const closeSheet = () => { if (this.state.psClosing) return; this.setState({ psClosing: true }); setTimeout(() => this.setState({ ps: false, psClosing: false }), 220); };
    const finishStage = (r) => {
      const next = [...this.state.results, r || { ok: false, lives: 0, correct: 0, mistakes: 1 }];
      const last = this.state.step === 4;
      this.setState({ results: next, step: this.state.step + 1, seconds: last ? Math.round((Date.now() - startedAt) / 1000) : this.state.seconds });
    };
    const startRun = (timed) => this.setState({ timedRun: timed, step: 1, results: [], startedAt: Date.now(), seconds: 0, run: this.state.run + 1 });
    return {
      sTab: step === 'tab', sList: step === 'list', sReview: step === 'review', sLearn: step === 'learn',
      s0: step === 0, s1: step === 1, s2: step === 2, s3: step === 3, s4: step === 4, s5: step === 5, s6: step === 6,
      a1: step === 1, a2: step === 2, a3: step === 3, a4: step === 4,
      topic: gym.topic,
      showDesc: this.state.showDesc !== false,
      // The timer pauses while the quit sheet or the prototype settings are open.
      paused: !!this.state.quit || !!this.state.settingsOpen,
      settingsOpen: !!this.state.settingsOpen,
      openSettings: () => this.setState({ settingsOpen: true }),
      closeSettings: () => this.setState({ settingsOpen: false }),
      settingsScrim: (e) => { if (e.target === e.currentTarget) this.setState({ settingsOpen: false }); },
      toggleDesc: () => this.setState({ showDesc: this.state.showDesc === false }),
      switchBg: this.state.showDesc !== false ? '#22C45D' : '#C2CED6',
      knobX: this.state.showDesc !== false ? 21 : 3,
      timedRun: this.state.timedRun !== false,
      results, seconds, run, lang,
      gymDone: !!(this.state.done && this.state.done['SR-GYM01']),
      doneMap: this.state.done || {},
      gymList: GYMS.map((g) => ({ id: g.id, topic: g.topic, afterUnit: g.afterUnit })),
      langTag: 'sr-Latn', languageName: 'Serbian',
      grammarCards: gym.cards,
      // ⓘ: Form Forge shows section 1's rule, Lane Sort section 2's.
      ffRule: info(gym.cards[0]), lsRule: info(gym.cards[1]),
      ff1: gym.ff.slice(0, half), ls1: lsContent(split[0]), ff2: gym.ff.slice(half), ls2: lsContent(split[1]),
      rows: [
        { name: gym.cards[0].title, skill: 'Form Forge' }, { name: gym.cards[1].title, skill: 'Lane Sort' },
        { name: gym.cards[0].title, skill: 'Form Forge' }, { name: gym.cards[1].title, skill: 'Lane Sort' },
      ],
      toLearnTab: () => this.setState({ step: 'tab', ps: false }),
      toReview: () => this.setState({ step: 'review' }),
      // Picking a course returns to its Learn tab; each course keeps its own completed tile.
      // Learn tab tile: the bottom sheet first; Start opens Learn the rule.
      openSheet: () => { this.setState({ ps: true, psClosing: false, psEntered: false }); setTimeout(() => this.setState({ psEntered: true }), 320); },
      ps: !!this.state.ps,
      psStart: () => this.setState({ ps: false, psClosing: false, step: 'learn', origin: 'tab', gym: 'SR-GYM01', results: [], run: this.state.run + 1 }),
      psScrimTap: (e) => { if (e.target === e.currentTarget) closeSheet(); },
      psSheetCls: this.state.psClosing ? 'q-out' : (this.state.psEntered ? '' : 'q-in'),
      psScrimCls: this.state.psClosing ? 'q-scrim-out' : 'q-scrim-in',
      // Review tab > Grammar Gym: straight to Learn the rule; every exit returns to Review.
      toList: () => this.setState({ step: 'list' }),
      // Review › Grammar Gym › a session: Learn the rule for that Gym; every exit returns to the list.
      pickGym: (id) => this.setState({ gym: id, step: 'learn', origin: 'list', results: [], run: this.state.run + 1 }),
      exit: () => this.setState({ step: back() }),
      toStartScreen: () => this.setState({ step: 0 }),
      // X during an exercise: confirm first with the Quit exercise sheet (Ling App Layouts); the clock pauses meanwhile.
      quit: !!this.state.quit,
      askQuit: () => { this.setState({ quit: true, qClosing: false, qDrag: 0, qEntered: false }); setTimeout(() => this.setState({ qEntered: true }), 320); },
      // Dismiss: slide the sheet down, then close. Tapping the scrim or dragging the handle down past 80px does the same.
      cancelQuit: () => { if (this.state.qClosing) return; this.setState({ qClosing: true }); setTimeout(() => this.setState({ quit: false, qClosing: false, qDrag: 0 }), 220); },
      scrimTap: (e) => { if (e.target === e.currentTarget) { if (this.state.qClosing) return; this.setState({ qClosing: true }); setTimeout(() => this.setState({ quit: false, qClosing: false, qDrag: 0 }), 220); } },
      qScrimCls: this.state.qClosing ? 'q-scrim-out' : 'q-scrim-in',
      qSheetCls: this.state.qClosing && !this.state.qDrag ? 'q-out' : (this.state.qEntered ? '' : 'q-in'),
      qDragY: this.state.qDrag || 0,
      qTrans: this.state.qDragging ? 'none' : 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)',
      qGrab: (e) => { if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); this.qY0 = e.clientY; this.setState({ qDragging: true }); },
      qMove: (e) => { if (this.qY0 == null) return; this.setState({ qDrag: Math.max(0, e.clientY - this.qY0) }); },
      qRelease: () => {
        if (this.qY0 == null) return;
        this.qY0 = null;
        if ((this.state.qDrag || 0) > 80) { this.setState({ qDragging: false, qClosing: true, qDrag: 520 }); setTimeout(() => this.setState({ quit: false, qClosing: false, qDrag: 0 }), 220); }
        else this.setState({ qDragging: false, qDrag: 0 });
      },
      confirmQuit: () => this.setState({ quit: false, step: back(), results: [], run: this.state.run + 1 }),
      finish: finishStage,
      begin: () => startRun(true),
      restart: () => startRun(false),
      // Reaching the Complete screen marks this course's Grammar Gym tile as completed.
      toComplete: () => this.setState({ step: 6, done: { ...(this.state.done || {}), [gym.id]: true } }),
      toStart: () => this.setState({ step: back(), results: [], seconds: 0, run: this.state.run + 1 }),
    };
  }
}
</script>
