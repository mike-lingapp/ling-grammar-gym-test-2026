<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Review tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.rv-hot{position:absolute;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rv-hot:focus-visible{outline:3px solid #33B2FF;outline-offset:2px}
.rv-scroll{scrollbar-width:none}.rv-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7FBFF">
  <!-- Figma · 1. Grammar Gym Navigation · Review.tsx. Grammar Gym is the only live row. -->
  <img src="/_blob/bfd204e2e8a7683fddf31b8a971c75fa" alt="" width="390" height="100" style="position: absolute; left: 0; top: 0; display: block; width: 390px; height: 100px">
  <div class="rv-scroll" style="position: absolute; left: 0; top: 100px; width: 390px; bottom: 104px; overflow-y: auto; overscroll-behavior: contain">
    <div style="position: relative; width: 390px; height: 937px">
      <img src="/_blob/dc6743db63b2f7de22637cd358228205" alt="" width="390" height="937" style="display: block; width: 390px; height: 937px">
      <button class="rv-hot" onClick="{{openGym}}" aria-label="Grammar Gym" style="left: 16px; top: 356px; width: 358px; height: 96px; border-radius: 16px"></button>
    </div>
  </div>
  <img src="/_blob/d6ec7e259426ce3fb2ef5e1dd8a44c69" alt="" width="390" height="104" style="position: absolute; left: 0; bottom: 0; display: block; width: 390px; height: 104px">
  <nav aria-label="Main" style="position: absolute; left: 0; bottom: 24px; width: 390px; height: 80px">
    <button class="rv-hot" onClick="{{learn}}" aria-label="Learn" style="left: 0; top: 0; width: 130px; height: 80px"></button>
    <button class="rv-hot" aria-current="page" aria-label="Review" style="left: 130px; top: 0; width: 130px; height: 80px"></button>
    <button class="rv-hot" aria-label="Profile" style="left: 260px; top: 0; width: 130px; height: 80px"></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onGym":{"editor":null},"onLearn":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      openGym: () => { if (typeof this.props.onGym === 'function') this.props.onGym(); },
      learn: () => { if (typeof this.props.onLearn === 'function') this.props.onLearn(); },
    };
  }
}
</script>
</body>
</html>
