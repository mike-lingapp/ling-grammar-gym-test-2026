<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D · Learn tab (Grammar Gym on the path)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.ld-hot{position:absolute;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ld-hot:focus-visible{outline:3px solid #33B2FF;outline-offset:2px}
.ld-scroll{scrollbar-width:none}.ld-scroll::-webkit-scrollbar{display:none}
@keyframes ldPop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.ld-done{animation:ldPop .45s cubic-bezier(.2,.8,.2,1) .25s both}
@media (prefers-reduced-motion: reduce){.ld-done{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans', sans-serif">
  <!-- Figma · 1. Grammar Gym Navigation · Learn.tsx (Serbian), Grammar Gym available / completed. -->
  <img src="/_blob/2a06dd8d5a658b34df76bcebf9e0c61b" alt="" width="390" height="157" style="position: absolute; left: 0; top: 0; display: block; width: 390px; height: 157px">
  <button class="ld-hot" onClick="{{language}}" aria-label="{{flagLabel}}" style="left: 8px; top: 41px; width: 48px; height: 48px; border-radius: 24px">
    <sc-if value="{{showFlag}}" hint-placeholder-val="{{ false }}">
      <span aria-hidden="true" style="position: absolute; left: 8px; top: 8px; width: 32px; height: 32px; border-radius: 16px; overflow: hidden; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(31,40,46,0.08)">
        <sc-if value="{{isCz}}" hint-placeholder-val="{{ false }}">
          <svg width="32" height="32" viewBox="0 0 30 30" preserveAspectRatio="xMidYMid slice"><rect width="30" height="15" fill="#FFFFFF"></rect><rect y="15" width="30" height="15" fill="#D7141A"></rect><polygon points="0,0 15,15 0,30" fill="#11457E"></polygon></svg>
        </sc-if>
        <sc-if value="{{isIt}}" hint-placeholder-val="{{ false }}">
          <svg width="32" height="32" viewBox="0 0 30 30" preserveAspectRatio="xMidYMid slice"><rect width="10" height="30" fill="#009246"></rect><rect x="10" width="10" height="30" fill="#FFFFFF"></rect><rect x="20" width="10" height="30" fill="#CE2B37"></rect></svg>
        </sc-if>
      </span>
    </sc-if>
  </button>

  <div id="ld-scroll" class="ld-scroll" style="position: absolute; left: 0; top: 157px; width: 390px; bottom: 105px; overflow-y: auto; overscroll-behavior: contain; background: #FFFFFF">
    <div style="position: relative; width: 390px; height: 1478px">
      <img src="/_blob/8dd44364dc06ddd1cedd8c2576bcfc20" alt="" width="390" height="1478" style="display: block; width: 390px; height: 1478px">
      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
        <img class="ld-done" src="/_blob/2736bbdb3f9f8a5fb0c56639ff4d4de7" alt="" width="112" height="112" style="position: absolute; left: 139px; top: 704px; display: block; width: 112px; height: 112px; pointer-events: none">
      </sc-if>
      <button class="ld-hot" onClick="{{openGym}}" aria-label="{{gymLabel}}" style="left: 147px; top: 712px; width: 96px; height: 96px; border-radius: 24px"></button>
    </div>
  </div>

  <img src="/_blob/8e6b6f6da89f642c3f464947fd667c45" alt="" width="390" height="105" style="position: absolute; left: 0; bottom: 0; display: block; width: 390px; height: 105px">
  <nav aria-label="Main" style="position: absolute; left: 0; bottom: 25px; width: 390px; height: 80px">
    <button class="ld-hot" aria-current="page" aria-label="Learn" style="left: 0; top: 0; width: 130px; height: 80px"></button>
    <button class="ld-hot" onClick="{{review}}" aria-label="Review" style="left: 130px; top: 0; width: 130px; height: 80px"></button>
    <button class="ld-hot" aria-label="Profile" style="left: 260px; top: 0; width: 130px; height: 80px"></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["sr","cz","it"],"default":"sr"},"done":{"editor":"boolean","default":false},"onGym":{"editor":null},"onLanguage":{"editor":null},"onReview":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Opens scrolled to the current lesson, as the app does, so the Grammar Gym island is in view.
  componentDidMount() {
    this.t = setTimeout(() => {
      const el = document.getElementById('ld-scroll');
      if (el && !el.dataset.scrolled) { el.scrollTop = 470; el.dataset.scrolled = '1'; }
    }, 0);
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const lang = this.props.lang || 'sr';
    const done = this.props.done === true;
    const names = { sr: 'Serbian', cz: 'Czech', it: 'Italian' };
    return {
      done,
      // The Figma header shows the Serbian flag; other courses draw their flag over it.
      showFlag: lang !== 'sr', isCz: lang === 'cz', isIt: lang === 'it',
      flagLabel: 'Course: ' + (names[lang] || 'Serbian') + '. Change language',
      gymLabel: done ? 'Grammar Gym, completed' : 'Grammar Gym, available',
      openGym: () => { if (typeof this.props.onGym === 'function') this.props.onGym(); },
      language: () => { if (typeof this.props.onLanguage === 'function') this.props.onLanguage(); },
      review: () => { if (typeof this.props.onReview === 'function') this.props.onReview(); },
    };
  }
}
</script>
</body>
</html>
