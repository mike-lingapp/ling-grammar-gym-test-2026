<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grammar Gym header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; display: flex; flex-direction: column; font-family: 'Noto Sans', sans-serif; color: #29353D; background: #FFFFFF">

  <sc-if value="{{timed}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; justify-content: center; padding-bottom: 4px">
      <div aria-hidden="true" style="height: 36px; box-sizing: border-box; padding: 0 12px 0 5px; border-radius: 999px; background: {{pill.bg}}; display: flex; align-items: center; gap: 6px; flex-shrink: 0; transition: background 0.3s">
        <span style="width: 26px; height: 26px; border-radius: 13px; background: {{pill.dot}}; color: #FFFFFF; transition: background 0.3s; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        </span>
        <span style="font-size: 15px; line-height: 20px; font-weight: 800; color: {{pill.ink}}; font-variant-numeric: tabular-nums">{{clockText}}</span>
      </div>
      <span role="timer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{timeText}}</span>
    </div>
  </sc-if>

  <div style="height: 52px; display: flex; align-items: center; gap: 10px">
    <button onClick="{{close}}" aria-label="Close exercise" style="width: 44px; height: 44px; margin-left: -10px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #29353D; cursor: pointer; flex-shrink: 0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #F0F3F5; overflow: hidden">
      <div style="width: {{progress}}; height: 8px; border-radius: 4px; background: #66C3FF; transition: width 0.4s"></div>
    </div>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{stepText}}</span>
    <div style="display: flex; align-items: center; flex-shrink: 0">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{livesText}}</span>
      <div aria-hidden="true" style="height: 20px; box-sizing: border-box; padding: 2px; border-radius: 999px; border: 2px solid #C2CED6; background: #FFFFFF; display: flex; align-items: center; gap: 2px">
        <sc-for list="{{lifeSegs}}" as="g" hint-placeholder-count="3">
          <span style="width: 18px; height: 12px; border-radius: {{g.radius}}; background: {{g.bg}}; transition: background 0.3s"></span>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"int","default":1,"min":1,"max":4},"total":{"editor":"int","default":4,"min":1,"max":12},"lives":{"editor":"int","default":3,"min":0,"max":3},"timed":{"editor":"boolean","default":true},"timeTotal":{"editor":"int","default":60,"min":1,"max":600},"paused":{"editor":"boolean","default":false},"done":{"editor":"boolean","default":false},"onTick":{"editor":null},"run":{"editor":null},"onClose":{"editor":null},"$preview":{"width":402,"height":92}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { timeLeft: Number(props.timeTotal ?? 60) };
  }
  // The countdown lives here: one tick a second while timed and not paused.
  // Each tick goes to the exercise through onTick(timeLeft); 0 means time is up.
  componentDidMount() {
    this.timer = setInterval(() => {
      const timed = this.props.timed ?? true;
      if (!(timed === true || timed === 'true')) return;
      if (this.props.paused === true || this.props.paused === 'true') return;
      if (this.state.timeLeft <= 0) return;
      const n = Math.max(0, this.state.timeLeft - 1);
      this.setState({ timeLeft: n });
      if (typeof this.props.onTick === 'function') this.props.onTick(n);
    }, 1000);
  }
  // A new run value from the exercise means it started over: refill the clock.
  componentDidUpdate(prev) {
    if (this.props.run !== prev.run) this.setState({ timeLeft: Number(this.props.timeTotal ?? 60) });
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const step = Number(this.props.step ?? 1);
    const total = Number(this.props.total ?? 4);
    const lives = Number(this.props.lives ?? 3);
    const timeTotal = Number(this.props.timeTotal ?? 60);
    const timeLeft = this.state.timeLeft;
    const timed = this.props.timed ?? true;
    // Same thresholds as the timer ring: green, then orange from 60% used, red past 70%.
    const used = 1 - timeLeft / timeTotal;
    const pill = used > 0.7 ? { bg: '#FDE8E8', dot: '#EF4444', ink: '#A40E0E' }
      : (used >= 0.6 ? { bg: '#FFEBCC', dot: '#FF9900', ink: '#995C00' } : { bg: '#E9FBF0', dot: '#22C45D', ink: '#17823E' });
    const lifeSegs = [0, 1, 2].map((i) => ({
      bg: i < lives ? '#FF9900' : '#F0F3F5',
      radius: i === 0 ? '6px 2px 2px 6px' : (i === 2 ? '2px 6px 6px 2px' : '2px'),
    }));
    return {
      timed: timed === true || timed === 'true',
      pill,
      clockText: Math.floor(timeLeft / 60) + ':' + String(timeLeft % 60).padStart(2, '0'),
      timeText: timeLeft === 0 ? 'Time is up' : timeLeft + ' seconds left',
      // Finished exercises: this one counts once it is done, so the last exercise fills the bar to 100%.
      progress: (100 * (step - 1 + (this.props.done === true || this.props.done === 'true' ? 1 : 0)) / total) + '%',
      stepText: 'Exercise ' + step + ' of ' + total,
      livesText: lives + ' of 3 lives left',
      lifeSegs,
      close: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); },
    };
  }
}
</script>
</body>
</html>
