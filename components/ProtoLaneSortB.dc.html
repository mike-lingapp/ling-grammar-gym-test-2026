<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans+Thai+Looped:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{overflow:hidden;overscroll-behavior:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;font-family:'Noto Sans',sans-serif;background:#FFFFFF;color:#29353D}
a{color:#006EB2}a:hover{color:#005E99}

:lang(th){font-family:'Noto Sans Thai Looped','Noto Sans',sans-serif}
.lane:focus-visible,.card:focus-visible{outline:3px solid #33B2FF;outline-offset:2px}
.shA{animation:shakeA .35s}.shB{animation:shakeB .35s}
@keyframes shakeA{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes shakeB{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fbs{animation:rise .25s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</helmet>
<div style="width: 402px; height: 874px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; padding: 62px 16px 34px; font-family: 'Noto Sans', sans-serif; color: #29353D; position: relative; overflow: hidden">

  <dc-import name="GymHeader" step="1" done="{{stageDone}}" total="4" lives="{{lives}}" timed="{{timedOn}}" time-total="{{timeTotal}}" paused="{{headerPaused}}" run="{{resets}}" on-tick="{{tick}}" on-close="{{close}}" hint-size="100%,92px"></dc-import>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 24px">
  <div style="display: flex; align-items: center; gap: 8px">

    <button class="lane" onClick="{{openRule}}" aria-label="How to sort: the rule" style="width: 40px; height: 40px; flex-shrink: 0; padding: 0; box-sizing: border-box; border-radius: 12px; border: 2px solid #E0E7EB; background: #FFFFFF; color: #3D505C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink: 0"><path d="M12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2ZM12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4ZM12 14.75C12.6904 14.75 13.25 15.3096 13.25 16C13.25 16.6904 12.6904 17.25 12 17.25C11.3096 17.25 10.75 16.6904 10.75 16C10.75 15.3096 11.3096 14.75 12 14.75ZM12 6C12.5523 6 13 6.44772 13 7V12C13 12.5523 12.5523 13 12 13C11.4477 13 11 12.5523 11 12V7C11 6.44772 11.4477 6 12 6Z"></path></svg></button>

  <div style="margin-top: {{pileMT}}px; height: {{pileH}}px; opacity: {{pileOp}}; position: relative; flex-shrink: 0; transition: height 0.25s ease, margin 0.25s ease, opacity 0.2s">

  <div style="margin-top: 8px; flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat({{laneCols}}, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: 10px">

        <span style="display: block; text-align: center">
          <span lang="{{langTag}}" style="display: block; font-size: 20px; line-height: 28px; font-weight: 800; color: #29353D">{{l.adj}}</span>
          <span style="display: block; font-size: {{l.gSize}}px; line-height: 18px; font-weight: 500; color: #5C788A">{{l.gender}}</span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 6px; flex: 1 0 auto">
          <sc-for list="{{l.items}}" as="n" hint-placeholder-count="2">
            <span lang="{{langTag}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 36px; box-sizing: border-box; padding: 4px; border-radius: 10px; border: 2px solid #51E186; background: #E9FBF0; color: #0F5729; font-size: 16px; line-height: 20px; font-weight: 600; text-align: center">{{n.word}}<sc-if value="{{n.hasTr}}" hint-placeholder-val="{{ false }}"><span style="display: block; font-family: 'Noto Sans', sans-serif; font-size: 11px; line-height: 14px; font-weight: 500; color: #17823E">{{n.tr}}</span></sc-if></span>
          </sc-for>
          <sc-if value="{{l.hint}}" hint-placeholder-val="{{ true }}">
            <span style="flex: 1; min-height: 36px; box-sizing: border-box; border-radius: 10px; border: 2px dashed {{l.hintLine}}; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; font-size: 12px; color: {{l.hintInk}}">Drop here</span>
          </sc-if>
        </span>
      </button>
    </sc-for>
  </div>
  </div>

  <sc-if value="{{showCheck}}" hint-placeholder-val="{{ true }}">
    <button onClick="{{skip}}" disabled="{{skipOff}}" style="width: 100%; height: 48px; margin-top: 16px; flex-shrink: 0; border: 0; border-radius: 12px; background: {{skipBg}}; color: {{skipInk}}; font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 18px; cursor: {{skipCursor}}">Continue</button>
  </sc-if>
  <sc-if value="{{showDone}}" hint-placeholder-val="{{ false }}">
    <div class="fbs" role="status" style="margin: 16px -16px -34px; padding: 20px 16px 34px; border-radius: 20px 20px 0 0; background: {{fb.bg}}; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
      <div style="display: flex; align-items: center; gap: 8px">
        <sc-if value="{{fb.ok}}" hint-placeholder-val="{{ true }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="{{fb.ink}}" stroke="none"><circle cx="12" cy="12" r="11"></circle><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </sc-if>
        <sc-if value="{{fb.warn}}" hint-placeholder-val="{{ false }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="{{fb.ink}}" stroke="none"><circle cx="12" cy="12" r="11"></circle><path d="M12 6.5v7" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"></path><circle cx="12" cy="17.2" r="1.5" fill="#FFFFFF"></circle></svg>
        </sc-if>
        <span style="flex-grow: 1; font-size: 20px; font-weight: 800; color: {{fb.ink}}">{{fb.title}}</span>
        <button aria-label="Report a problem" style="width: 44px; height: 44px; margin-right: -10px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: {{fb.ink}}; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>
        </button>
      </div>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: #29353D"><strong lang="{{langTag}}" style="font-weight: 700">{{fb.answer}}</strong><sc-if value="{{fb.hasNote}}" hint-placeholder-val="{{ false }}"><br><span lang="{{langTag}}" style="color: #3D505C">{{rule}}</span></sc-if></p>
      <button onClick="{{finish}}" style="margin-top: 4px; height: 48px; border-radius: 12px; background: {{fb.btn}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; width: 100%; border: 0; font-family: 'Noto Sans', sans-serif; cursor: pointer">Continue</button>
    </div>
  </sc-if>
  <sc-if value="{{timedOut}}" hint-placeholder-val="{{ false }}">
    <div class="fbs" role="status" style="margin: 16px -16px -34px; padding: 20px 16px 34px; border-radius: 20px 20px 0 0; background: #FEF3F3; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#A40E0E" stroke="none"><circle cx="12" cy="12" r="11"></circle><path d="M12 6.5V12l3.5 2.2" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="flex-grow: 1; font-size: 20px; font-weight: 800; color: #A40E0E">Time’s up</span>
        <button aria-label="Report a problem" style="width: 44px; height: 44px; margin-right: -10px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #A40E0E; cursor: pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>
        </button>
      </div>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: #29353D"><strong style="font-weight: 700">{{sortedText}}</strong><br><span lang="{{langTag}}" style="color: #3D505C">{{rule}}</span></p>
      <button onClick="{{finish}}" style="margin-top: 4px; height: 48px; border-radius: 12px; background: #D31212; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; width: 100%; border: 0; font-family: 'Noto Sans', sans-serif; cursor: pointer">Continue</button>
    </div>
  </sc-if>
  <sc-if value="{{timedOn}}" hint-placeholder-val="{{ true }}">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 402px; height: 874px; pointer-events: none">
    <dc-import name="GymTimerRing" time-left="{{timeLeft}}" time-total="{{timeTotal}}" hint-size="402px,874px"></dc-import>
  </div>
  </sc-if>
  <sc-if value="{{infoOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; width: 402px; height: 874px; z-index: 40">
      <dc-import name="GymInfoSheet" title="{{info.title}}" kicker="{{info.kicker}}" body="{{info.body}}" table="{{info.table}}" examples="{{info.examples}}" tips="{{info.tips}}" lang-tag="{{langTag}}" on-close="{{closeInfo}}" hint-size="402px,874px"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onFinish":{"editor":null},"active":{"editor":null},"run":{"editor":null},"onOut":{"editor":null},"onClose":{"editor":null},"paused":{"editor":null},"timed":{"editor":null},"depleted":{"editor":null},"rule":{"editor":null},"content":{"editor":null},"langTag":{"editor":null},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh();
  }
  // A clean start: used on first load, when the Full flow shows this stage, and on Train again.
  // Cards come off the pile in a random order each run (never in the order the content lists them).
  shuffledOrder() {
    const n = (this.props && this.props.content && this.props.content.nouns) ? this.props.content.nouns.length : 6;
    const base = [...Array(n).keys()];
    let o = base;
    for (let tries = 0; tries < 10; tries++) {
      o = base.map((x) => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map((q) => q[1]);
      if (n < 3 || o.some((x, i) => x !== i)) break;
    }
    return o;
  }
  fresh() {
    return { ...{ order: this.shuffledOrder(), info: null, idx: 0, placed: [[], [], []], slips: 0, slipped: [], wrong: false, shake: 0, flashLane: null, okLane: null, timeLeft: 60, timedOut: false, drag: null, hoverLane: null }, resets: ((this.state && this.state.resets) || 0) + 1 };
  }
  componentDidUpdate(prev) {
    const on = this.props.active !== false;
    const was = prev.active !== false;
    if ((on && !was) || this.props.run !== prev.run) { this.outSent = false; this.setState(this.fresh()); return; }
    // Last life gone: tell the Full flow at once so it can show the failed panel.
    if (on && this.lives === 0 && this.props.depleted !== true && !this.outSent && typeof this.props.onOut === 'function') {
      this.outSent = true;
      this.props.onOut();
    }
  }
  // Lane flashes clear themselves: red after 700ms, green after 400ms (Mike v2).
  flash(key, lane, ms) {
    this.flashTokens = this.flashTokens || {};
    const t = (this.flashTokens[key] || 0) + 1;
    this.flashTokens[key] = t;
    this.setState({ [key]: lane });
    setTimeout(() => { if (this.flashTokens[key] === t) this.setState({ [key]: null }); }, ms);
  }
  renderVals() {
    // Content comes from the Full flow (6 nouns + lane labels for the chosen language);
    // on its own the screen plays this Serbian set.
    const content = this.props.content || {
      lanes: [['dobar', 'masculine'], ['dobra', 'feminine'], ['dobro', 'neuter']],
      rule: 'Ends in a consonant: masculine (dobar). Ends in -a: feminine (dobra). Ends in -o or -e: neuter (dobro).',
      nouns: [['čovek', 'man', 0], ['kuća', 'house', 1], ['vino', 'wine', 2], ['žena', 'woman', 1], ['grad', 'city', 0], ['dete', 'child', 2]],
    };
    // Thai glosses arrive as "romanisation · English": split them so the card shows both lines.
    const order = Array.isArray(this.state.order) && this.state.order.length === content.nouns.length ? this.state.order : content.nouns.map((_, i) => i);
    const nouns = order.map((i) => content.nouns[i]).map((n) => {
      const parts = String(n[1]).split(' · ');
      return parts.length > 1 ? { word: n[0], tr: parts[0], en: parts.slice(1).join(' · '), lane: n[2] } : { word: n[0], tr: '', en: n[1], lane: n[2] };
    });
    const laneDefs = content.lanes.map((l) => ({ adj: l[0], gender: l[1] }));
    const langTag = this.props.langTag || 'sr-Latn';
    const thai = langTag === 'th';
    const { idx, placed, slips, slipped, wrong, timeLeft, timedOut, flashLane, okLane, hoverLane } = this.state;
    const done = idx >= nouns.length;
    const total = 60;
    const current = done ? { word: '', tr: '', en: '', hasTr: false } : { ...nouns[idx], hasTr: !!nouns[idx].tr };
    const lanes = laneDefs.map((l, i) => {
      const over = hoverLane === i;
      const red = flashLane === i;
      const green = okLane === i;
      return {
        ...l,
        index: i,
        gSize: l.gender.length > 14 ? 11 : 13,
        items: placed[i].map((k) => ({ word: nouns[k].word, tr: nouns[k].tr, hasTr: !!nouns[k].tr })),
        hint: !placed[i].length && !done && !timedOut,
        hintLine: over ? '#33B2FF' : '#E0E7EB',
        hintInk: over ? '#006EB2' : '#5C788A',
        border: red ? '#EF4444' : (over ? '#33B2FF' : (green ? '#51E186' : '#E0E7EB')),
        bg: red ? '#FDE8E8' : (over ? '#E6F5FF' : '#F9FAFB'),
        scale: over ? 1.02 : 1,
        aria: done ? l.adj + ', ' + l.gender : l.adj + ', ' + l.gender + '. Tap to put ' + nouns[idx].word + ' here',
        // C · Instant feedback: right = locks green in the lane; wrong = the card stays on the pile,
        // shakes and turns red, and the lane flashes red.
        drop: () => {
          if (done || this.state.timedOut) return;
          const n = nouns[idx];
          if (n.lane === i) {
            const next = placed.map((p, k) => (k === i ? [...p, idx] : p));
            this.setState({ idx: idx + 1, placed: next, wrong: false });
            this.flash('okLane', i, 400);
          } else {
            this.setState({ slips: slips + 1, slipped: slipped.includes(idx) ? slipped : [...slipped, idx], wrong: true, shake: this.state.shake + 1 });
            this.flash('flashLane', i, 700);
          }
        },
      };
    });
    // Drag and drop: the front card follows the pointer, lifted and tilted; letting go over a lane
    // drops it there (same rules as tapping). Let go anywhere else and it springs back.
    const drag = this.state.drag;
    const laneAt = (x, y) => {
      const hits = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [];
      for (const el of hits) {
        const b = el.closest && el.closest('[data-lane]');
        if (b) return Number(b.getAttribute('data-lane'));
      }
      return null;
    };
    const canDrag = !done && !timedOut;
    const left = nouns.length - idx;
    // Show at most 3 cards: the front one plus up to 2 behind, deepest first so the front sits on top.
    const behind = Math.max(0, Math.min(left - 1, 2));
    const stack = [];
    for (let k = behind; k >= 1; k--) {
      stack.push({ top: k * 6, inset: k * 8, bg: k % 2 ? '#F9FAFB' : '#FFFFFF' });
    }
    // After Try again on an out-of-lives game the lives stay at 0 and the game can't score higher.
    const lives = this.props.depleted === true ? 0 : Math.max(0, 3 - slips - (timedOut ? 1 : 0));
    this.lives = lives;
    // Result (Mike v2): no slips = green; any slip = yellow, naming the nouns to watch.
    const n = nouns.length;
    const watch = slipped.map((k) => nouns[k].word + ' → ' + laneDefs[nouns[k].lane].adj).join(', ');
    const fb = slipped.length === 0
      ? { ok: true, warn: false, bg: '#E9FBF0', ink: '#17823E', btn: '#1A9848', title: 'Excellent!', answer: 'All ' + n + ' nouns sorted, no slips.', hasNote: false }
      : { ok: false, warn: true, bg: '#FFF4D9', ink: '#806519', btn: '#F2BC26', title: 'All sorted', answer: (n - slipped.length) + ' of ' + n + ' right first time. Watch ' + (slipped.length === 1 ? 'this one' : 'these') + ': ' + watch + '.', hasNote: !!content.rule };
    // Inside the Full flow the parent passes onFinish; on its own Continue replays this screen.
    const embedded = typeof this.props.onFinish === 'function';
    return {
      // Info sheets (rule, tag, pattern): the timer pauses while one is open.
      infoOpen: !!this.state.info,
      info: this.state.info || {},
      closeInfo: () => this.setState({ info: null }),
      // Train again runs untimed: only the total time is counted on Results.
      timedOn: this.props.timed !== false,
      embedded,
      standalone: !embedded,
      // X in the header: the Full flow takes you back to the language picker.
      close: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); },
      resets: this.state.resets,
      headerPaused: this.props.active === false || this.props.paused === true || !!this.state.info || timedOut || done,
      finish: () => { if (embedded) this.props.onFinish({ ok: done && !timedOut && lives > 0, lives, correct: placed.flat().filter((k) => !slipped.includes(k)).length, total: nouns.length, mistakes: slips + (timedOut ? nouns.length - placed.flat().length : 0) }); else this.setState(this.fresh()); },
      lives,
      timeTotal: total,
      tick: (t) => this.setState(t <= 0 ? { timeLeft: 0, timedOut: true, drag: null, hoverLane: null } : { timeLeft: t }),
      timeLeft,
      grab: (e) => {
        if (!canDrag) return;
        if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
        this.setState({ drag: { x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, moved: false } });
      },
      move: (e) => {
        const d = this.state.drag;
        if (!d) return;
        const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
        const moved = d.moved || Math.hypot(dx, dy) > 4;
        this.setState({ drag: { ...d, dx, dy, moved }, hoverLane: moved ? laneAt(e.clientX, e.clientY) : null });
      },
      release: (e) => {
        const d = this.state.drag;
        if (!d) return;
        const target = d.moved ? laneAt(e.clientX, e.clientY) : null;
        this.setState({ drag: null, hoverLane: null });
        if (target !== null) lanes[target].drop();
      },
      cancel: () => this.setState({ drag: null, hoverLane: null }),
      dragX: drag ? drag.dx : 0,
      dragY: drag ? drag.dy : 0,
      dragScale: drag && drag.moved ? 1.06 : 1,
      dragTilt: drag && drag.moved ? -2 : 0,
      cardShadow: drag && drag.moved ? '0 12px 28px rgba(31,40,46,0.28)' : '0 2px 8px rgba(31,40,46,0.08)',
      cardCursor: canDrag ? (drag ? 'grabbing' : 'grab') : 'default',
      // No transition while dragging so the card tracks the finger; spring back when let go.
      cardTransition: drag ? 'background 0.2s, border-color 0.2s' : 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s, background 0.2s, border-color 0.2s',
      // The wrong card shakes each time (two identical keyframes, alternated, so it replays).
      shakeCls: wrong && !drag ? (this.state.shake % 2 ? 'shA' : 'shB') : '',
      rule: content.rule || '', langTag, laneCols: laneDefs.length,
      current, lanes, done, stack, fb,
      hasCard: !done,
      // The pile folds away once the last card is placed.
      pileH: left > 0 ? 104 : 0,
      pileMT: left > 0 ? 14 : 0,
      pileOp: left > 0 ? 1 : 0,
      showCheck: !done && !timedOut,
      showDone: done && !timedOut,
      stageDone: done || timedOut,
      timedOut,
      locked: done || timedOut,
      sortedText: 'You sorted ' + placed.flat().length + ' of ' + n + '.',
      cardBorder: wrong ? '#EF4444' : '#33B2FF',
      cardBg: wrong ? '#FDE8E8' : '#E6F5FF',
      gripInk: wrong ? '#EF4444' : '#33B2FF',
      subText: wrong ? (thai ? 'Not that lane. What kind of thing is it?' : 'Not that lane. Check the ending.') : current.en,
      subInk: wrong ? '#A40E0E' : '#5C788A',
      subWeight: wrong ? 600 : 400,
      leftText: left > 0 ? left + ' of ' + n + ' left' : 'All placed',
      // Out of lives and practising: Continue is live, so the learner can leave the remaining cards and move on.
      skipOff: !(this.props.depleted === true && embedded),
      skipBg: this.props.depleted === true && embedded ? '#FF9900' : '#E0E7EB',
      skipInk: this.props.depleted === true && embedded ? '#FFFFFF' : '#5C788A',
      skipCursor: this.props.depleted === true && embedded ? 'pointer' : 'default',
      skip: () => { if (this.props.depleted === true && embedded) this.props.onFinish({ ok: false, lives: 0, correct: 0, mistakes: slips, total: nouns.length }); },
      // Info button: the rule taught before the exercises (gender / classifier), available before any mistake.
      openRule: () => this.setState({ info: this.props.rule || { title: 'How to sort', body: content.rule || '' }, drag: null, hoverLane: null }),
    };
  }
}
</script>
</body>
</html>
