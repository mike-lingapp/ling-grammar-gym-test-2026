<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E · Grammar lesson start (Ling Studio content)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Poppins:wght@700&amp;display=swap">
<style>
body{margin:0}
.gd-btn:focus-visible{outline:3px solid #33B2FF;outline-offset:2px}
.gd-in{animation:gdIn .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes gdIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){.gd-in{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column; font-family: 'Noto Sans', sans-serif; color: #3D505C">
  <!-- Figma · Grammar lesson start / start two: back, segmented progress, eyebrow, title + paragraph, table, tip banner. -->
  <div style="height: 52px; flex-shrink: 0"></div>
  <div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 4px 16px 4px 4px; display: flex; align-items: center; gap: 8px">
    <button class="gd-btn" onClick="{{back}}" aria-label="{{backLabel}}" style="width: 48px; height: 48px; padding: 0; border: 0; border-radius: 12px; background: transparent; color: #3D505C; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div role="progressbar" aria-label="{{progressLabel}}" aria-valuemin="1" aria-valuemax="{{count}}" aria-valuenow="{{step}}" style="flex: 1 1 auto; display: flex; gap: 8px; margin-left: 4px">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="2">
        <span style="flex: 1 1 0; height: 8px; border-radius: 4px; background: {{s.bg}}; transition: background 0.3s"></span>
      </sc-for>
    </div>
  </div>

  <div class="gd-in" key="{{idx}}" onTouchStart="{{tStart}}" onTouchEnd="{{tEnd}}" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 0">
    <p style="margin: 0; min-height: 32px; font-size: 12px; line-height: 16px; font-weight: 600; color: #009DFF">{{eyebrow}}</p>
    <h1 style="margin: 0; font-family: 'Poppins', sans-serif; font-size: 18px; line-height: 27px; font-weight: 700; color: #3D505C">{{card.title}}</h1>
    <p style="margin: 2px 0 0; font-size: 14px; line-height: 21px; color: #5C788A">{{card.body}}</p>
    <sc-if value="{{hasTable}}" hint-placeholder-val="{{ true }}">
      <div role="table" style="margin-top: 12px; border: 1px solid #E0E7EB; border-radius: 8px; overflow: hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <div role="row" style="display: grid; grid-template-columns: {{cols}}; min-height: {{r.h}}px; align-items: center; background: {{r.bg}}; border-top: {{r.line}}">
            <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="3">
              <span role="{{c.role}}" lang="{{c.lang}}" style="grid-column: {{c.span}}; padding: 8px; font-size: {{c.size}}px; line-height: 20px; font-weight: {{c.weight}}; color: {{c.ink}}; overflow-wrap: anywhere">{{c.text}}</span>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{hasExample}}" hint-placeholder-val="{{ true }}">
      <!-- teach_example (Ling Studio): not in the Figma layout yet; shown like the info sheet's example. -->
      <div style="margin-top: 16px; padding: 10px 14px; border-radius: 12px; background: #E6F5FF; display: flex; flex-direction: column; gap: 2px">
        <span lang="{{langTag}}" style="font-size: 16px; line-height: 1.5; font-weight: 700; color: #29353D">{{exTarget}}</span>
        <sc-if value="{{hasExEn}}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; line-height: 1.5; color: #3D505C">{{exEn}}</span></sc-if>
      </div>
    </sc-if>
    <sc-for list="{{tips}}" as="t" hint-placeholder-count="1">
      <div style="margin-top: 16px; padding: 16px; border-radius: 12px; background: #FFF4D9; display: flex; align-items: flex-start; gap: 8px">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2BC26" stroke-width="2" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M9.5 3.5l1.6 4.4 4.4 1.6-4.4 1.6-1.6 4.4-1.6-4.4-4.4-1.6 4.4-1.6z"></path><path d="M17 13l.9 2.1 2.1.9-2.1.9L17 19l-.9-2.1-2.1-.9 2.1-.9z"></path></svg>
        <span style="font-size: 14px; line-height: 21px; color: #3D505C">{{t}}</span>
      </div>
    </sc-for>
  </div>

  <div style="height: 98px; flex-shrink: 0; box-sizing: border-box; padding: 10px 16px 40px">
    <button class="gd-btn" onClick="{{next}}" style="width: 100%; height: 48px; border: 0; border-radius: 16px; background: #FF9900; color: #FFFFFF; font-family: 'Noto Sans', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer">{{nextLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cards":{"editor":null},"language":{"editor":"text","default":"Serbian"},"langTag":{"editor":null},"run":{"editor":null},"onDone":{"editor":null},"onBack":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 0 };
  }
  componentDidUpdate(prev) { if (this.props.run !== prev.run) this.setState({ idx: 0 }); }
  renderVals() {
    const cards = Array.isArray(this.props.cards) && this.props.cards.length ? this.props.cards : [
      { title: 'Every noun has a gender', body: 'Serbian nouns are masculine, feminine or neuter. The last letter tells you which.', table: [['', 'ends in', 'example'], ['masculine', 'a consonant', 'grad (city)'], ['feminine', '-a', 'kuća (house)'], ['neuter', '-o or -e', 'selo (village)']] },
      { title: 'The words around it match', body: 'Words like dobar (good) change to match the noun’s gender.', table: [['masculine', 'dobar grad', 'a good city'], ['feminine', 'dobra kuća', 'a good house'], ['neuter', 'dobro selo', 'a good village']], tips: ['Easy to remember: consonant → dobar, -a → dobra, -o / -e → dobro.'] },
    ];
    const idx = Math.min(this.state.idx, cards.length - 1);
    const card = cards[idx];
    const last = idx === cards.length - 1;
    const tag = this.props.langTag || 'sr-Latn';
    const table = Array.isArray(card.table) ? card.table : [];
    // Ling Studio teach_table: rows "a = b" become two columns; a row with no "=" spans the table.
    const width = table.reduce((m, r) => Math.max(m, r.length), 1);
    const rows = table.map((r, k) => ({
      h: 40, bg: '#FFFFFF', line: k === 0 ? '0' : '1px solid #E0E7EB',
      cells: r.map((t, j) => ({ text: t, role: 'cell', span: r.length === 1 ? '1 / -1' : 'auto', lang: j === 0 ? tag : 'en', size: 14, weight: j === 0 && r.length > 1 ? 700 : 400, ink: '#3D505C' })),
    }));
    const ex = Array.isArray(card.example) ? card.example : [];
    const go = (d) => {
      const n = idx + d;
      if (n < 0) { if (typeof this.props.onBack === 'function') this.props.onBack(); return; }
      if (n >= cards.length) { if (typeof this.props.onDone === 'function') this.props.onDone(); return; }
      this.setState({ idx: n });
    };
    return {
      idx, card, step: idx + 1, count: cards.length,
      eyebrow: (this.props.language || 'Serbian') + ' grammar',
      segs: cards.map((_, i) => ({ bg: i <= idx ? '#99D6FF' : '#F0F3F5' })),
      progressLabel: 'Card ' + (idx + 1) + ' of ' + cards.length,
      hasTable: rows.length > 0, rows,
      cols: width >= 3 ? '1fr 1fr 1fr' : (width === 2 ? 'minmax(0, 1fr) minmax(0, 1.6fr)' : '1fr'),
      hasExample: !!ex[0], exTarget: ex[0] || '', exEn: ex[1] || '', hasExEn: !!ex[1], langTag: tag,
      tips: Array.isArray(card.tips) ? card.tips : [],
      nextLabel: last ? 'Start practice' : 'Next',
      backLabel: idx === 0 ? 'Back' : 'Previous card',
      next: () => go(1),
      back: () => go(-1),
      // Swipe between cards.
      tStart: (e) => { this.x0 = e.touches && e.touches[0] ? e.touches[0].clientX : null; },
      tEnd: (e) => {
        if (this.x0 == null || !e.changedTouches || !e.changedTouches[0]) return;
        const dx = e.changedTouches[0].clientX - this.x0; this.x0 = null;
        if (dx < -60 && !last) go(1); else if (dx > 60 && idx > 0) go(-1);
      },
    };
  }
}
</script>
</body>
</html>
