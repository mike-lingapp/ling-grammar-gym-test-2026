const GENDER_C = {"sr": {"tag": "sr-Latn", "cards": [{"kicker": "Noun gender", "title": "Every noun has a gender", "body": "Serbian nouns are masculine, feminine or neuter. The last letter tells you which.", "table": [["", "ends in", "example"], ["masculine", "a consonant", "grad (city)"], ["feminine", "-a", "kuća (house)"], ["neuter", "-o or -e", "selo (village)"]]}, {"kicker": "Noun gender", "title": "The words around it match", "body": "Words like dobar (good) change to match the noun’s gender.", "table": [["masculine", "dobar grad", "a good city"], ["feminine", "dobra kuća", "a good house"], ["neuter", "dobro selo", "a good village"]], "tips": ["Easy to remember: consonant → dobar, -a → dobra, -o / -e → dobro."]}], "ff": [{"title": "Pick the right word", "desc": "Tap or drag the answer into the box.", "cue": "dobar + kuća", "gloss": "(a good house)", "before": "", "after": "kuća", "options": ["dobar", "dobra", "dobro"], "correct": "dobra", "okAnswer": "dobra kuća", "meaning": "a good house", "answer": "dobra kuća", "note": "Kuća ends in -a, so it’s feminine: dobra.", "hint": "Look at the last letter of kuća."}, {"title": "Pick the right word", "desc": "Tap or drag the answer into the box.", "cue": "dobar + dete", "gloss": "(a good child)", "before": "", "after": "dete", "options": ["dobar", "dobra", "dobro"], "correct": "dobro", "okAnswer": "dobro dete", "meaning": "a good child", "answer": "dobro dete", "note": "Dete ends in -e, so it’s neuter: dobro.", "hint": "Look at the last letter of dete."}], "ls": [{"lanes": [["dobar", "masculine"], ["dobra", "feminine"], ["dobro", "neuter"]], "rule": "Consonant → masculine (dobar). -a → feminine (dobra). -o or -e → neuter (dobro).", "nouns": [["grad", "city", 0], ["kuća", "house", 1], ["selo", "village", 2], ["brat", "brother", 0], ["škola", "school", 1], ["pismo", "letter", 2]]}, {"lanes": [["dobar", "masculine"], ["dobra", "feminine"], ["dobro", "neuter"]], "rule": "Consonant → masculine (dobar). -a → feminine (dobra). -o or -e → neuter (dobro).", "nouns": [["dečak", "boy", 0], ["sestra", "sister", 1], ["more", "sea", 2], ["voz", "train", 0], ["knjiga", "book", 1], ["mleko", "milk", 2]]}]}, "cz": {"tag": "cs", "cards": [{"kicker": "Noun gender", "title": "Every noun has a gender", "body": "Czech nouns are masculine, feminine or neuter. The last letter usually tells you which.", "table": [["", "ends in", "example"], ["masculine", "a consonant", "kluk (boy)"], ["feminine", "-a", "žena (woman)"], ["neuter", "-o", "město (city)"]]}, {"kicker": "Noun gender", "title": "The words around it match", "body": "Words like dobrý (good) change to match the noun’s gender.", "table": [["masculine", "dobrý kluk", "a good boy"], ["feminine", "dobrá žena", "a good woman"], ["neuter", "dobré město", "a good city"]], "tips": ["Easy to remember: consonant → dobrý, -a → dobrá, -o → dobré."]}], "ff": [{"title": "Pick the right word", "desc": "Tap or drag the answer into the box.", "cue": "dobrý + město", "gloss": "(a good city)", "before": "", "after": "město", "options": ["dobrý", "dobrá", "dobré"], "correct": "dobré", "okAnswer": "dobré město", "meaning": "a good city", "answer": "dobré město", "note": "Město ends in -o, so it’s neuter: dobré.", "hint": "Look at the last letter of město."}, {"title": "Pick the right word", "desc": "Tap or drag the answer into the box.", "cue": "dobrý + káva", "gloss": "(good coffee)", "before": "", "after": "káva", "options": ["dobrý", "dobrá", "dobré"], "correct": "dobrá", "okAnswer": "dobrá káva", "meaning": "good coffee", "answer": "dobrá káva", "note": "Káva ends in -a, so it’s feminine: dobrá.", "hint": "Look at the last letter of káva."}], "ls": [{"lanes": [["dobrý", "masculine"], ["dobrá", "feminine"], ["dobré", "neuter"]], "rule": "Consonant → masculine (dobrý). -a → feminine (dobrá). -o → neuter (dobré).", "nouns": [["kluk", "boy", 0], ["žena", "woman", 1], ["město", "city", 2], ["stůl", "table", 0], ["škola", "school", 1], ["auto", "car", 2]]}, {"lanes": [["dobrý", "masculine"], ["dobrá", "feminine"], ["dobré", "neuter"]], "rule": "Consonant → masculine (dobrý). -a → feminine (dobrá). -o → neuter (dobré).", "nouns": [["bratr", "brother", 0], ["sestra", "sister", 1], ["jezero", "lake", 2], ["obchod", "shop", 0], ["kniha", "book", 1], ["mléko", "milk", 2]]}]}, "it": {"tag": "it", "cards": [{"kicker": "Noun gender", "title": "Every noun is masculine or feminine", "body": "Most Italian nouns end in -o or -a. The ending tells you the gender.", "table": [["", "ends in", "example"], ["masculine", "-o", "libro (book)"], ["feminine", "-a", "casa (house)"]]}, {"kicker": "Noun gender", "title": "il or la?", "body": "The word for “the” matches the noun: il for masculine, la for feminine.", "table": [["il", "masculine", "il libro, il gatto"], ["la", "feminine", "la casa, la pizza"]], "tips": ["Easy to remember: -o → il, -a → la."]}], "ff": [{"title": "Pick the right word", "desc": "Tap or drag the answer into the box.", "cue": "il / la + gatto", "gloss": "(the cat)", "before": "", "after": "gatto", "options": ["il", "la"], "correct": "il", "okAnswer": "il gatto", "meaning": "the cat", "answer": "il gatto", "note": "Gatto ends in -o, so it’s masculine: il.", "hint": "Look at the last letter of gatto."}, {"title": "Pick the right word", "desc": "Tap or drag the answer into the box.", "cue": "il / la + porta", "gloss": "(the door)", "before": "", "after": "porta", "options": ["il", "la"], "correct": "la", "okAnswer": "la porta", "meaning": "the door", "answer": "la porta", "note": "Porta ends in -a, so it’s feminine: la.", "hint": "Look at the last letter of porta."}], "ls": [{"lanes": [["il", "masculine"], ["la", "feminine"]], "rule": "-o → masculine (il). -a → feminine (la).", "nouns": [["libro", "book", 0], ["casa", "house", 1], ["gatto", "cat", 0], ["pizza", "pizza", 1], ["vino", "wine", 0], ["borsa", "bag", 1]]}, {"lanes": [["il", "masculine"], ["la", "feminine"]], "rule": "-o → masculine (il). -a → feminine (la).", "nouns": [["ragazzo", "boy", 0], ["ragazza", "girl", 1], ["treno", "train", 0], ["mela", "apple", 1], ["tavolo", "table", 0], ["finestra", "window", 1]]}]}};
const LANG_NAMES = { sr: 'Serbian', cz: 'Czech', it: 'Italian' };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    // One state for the whole run, so the results screen sees every answer.
    // Test mode (hosted links for unmoderated testing): no Learn / Review tabs. Start on the language picker,
    // go straight to Learn the rule, and every exit (back, quit, finish) returns to the language picker.
    this.testMode = props && props.mode === 'test';
    this.state = { step: this.testMode ? 'lang' : 'tab', origin: this.testMode ? 'test' : 'tab', timedRun: true, lang: 'sr', results: [], startedAt: Date.now(), seconds: 0, run: 1 };

  renderVals() {
    const { step, results, startedAt, seconds, run, lang } = this.state;
    const C = GENDER_C[lang] || GENDER_C.sr;
    const closeSheet = () => { if (this.state.psClosing) return; this.setState({ psClosing: true }); setTimeout(() => this.setState({ ps: false, psClosing: false, psDrag: 0 }), 220); };

    // A game's result: Form Forge = { ok, lives, correct, mistakes }; Lane Sort adds total (6 nouns).
    const finishStage = (r) => {
      const next = [...this.state.results, r || { ok: false, lives: 0, correct: 0, mistakes: 1 }];
      const last = this.state.step === 4;
      this.setState({ results: next, step: this.state.step + 1, seconds: last ? Math.round((Date.now() - startedAt) / 1000) : this.state.seconds });
    };
    const startRun = (timed) => this.setState({ timedRun: timed, step: 1, results: [], startedAt: Date.now(), seconds: 0, run: this.state.run + 1 });
    return {
      sTab: step === 'tab', sLang: step === 'lang', sReview: step === 'review', sList: step === 'list', sLearn: step === 'learn',
      s0: step === 0, s1: step === 1, s2: step === 2, s3: step === 3, s4: step === 4, s5: step === 5, s6: step === 6,
      // Out-of-lives is handled inside each game now (Ling App Layouts), so only the quit sheet can pause a stage.
      a1: step === 1, a2: step === 2, a3: step === 3, a4: step === 4,
      timedRun: this.state.timedRun !== false,
      results, seconds, run, lang,
      langTag: C.tag, languageName: LANG_NAMES[lang] || 'Serbian',
      grammarCards: C.cards,
      // ⓘ in every game: the first card of Learn the rule.
      rule: C.cards[0],
      ff1: C.ff[0], ls1: C.ls[0], ff2: C.ff[1], ls2: C.ls[1],
      toStartScreen: () => this.setState({ step: 0 }),
      toReview: () => this.setState({ step: 'review' }),
      toLearnTab: () => this.setState({ step: 'tab' }),
      toLanguages: () => this.setState({ step: 'lang' }),
      testMode: !!this.testMode,
      pickerSelected: this.testMode ? 'none' : lang,
      pickLang: (id) => this.setState({ lang: id, step: this.testMode ? 'learn' : 'tab', origin: this.testMode ? 'test' : this.state.origin, results: [], run: this.state.run + 1 }),
      toList: () => this.setState({ step: 'list', origin: 'review' }),
      openFromPath: () => { this.setState({ ps: true, psClosing: false, psDrag: 0, psEntered: false }); setTimeout(() => this.setState({ psEntered: true }), 320); },
      psStart: () => this.setState({ ps: false, psClosing: false, psDrag: 0, step: 'learn', origin: 'tab', results: [], run: this.state.run + 1 }),
      ps: !!this.state.ps,
      psUnit: 'Getting started',
      psScrimTap: (e) => { if (e.target === e.currentTarget) closeSheet(); },
      psSheetCls: this.state.psClosing && !this.state.psDrag ? 'q-out' : (this.state.psEntered ? '' : 'q-in'),
      psScrimCls: this.state.psClosing ? 'q-scrim-out' : 'q-scrim-in',
      psDragY: this.state.psDrag || 0,

      closeStart: () => this.setState({ step: exitTo() }),
      // X during an exercise: confirm first with the Quit exercise sheet (Ling App Layouts); the clock pauses meanwhile.
      quit: !!this.state.quit,
      askQuit: () => { this.setState({ quit: true, qClosing: false, qDrag: 0, qEntered: false }); setTimeout(() => this.setState({ qEntered: true }), 320); },
      // Dismiss: slide the sheet down, then close. Tapping the scrim or dragging the handle down past 80px does the same.
      cancelQuit: () => { if (this.state.qClosing) return; this.setState({ qClosing: true }); setTimeout(() => this.setState({ quit: false, qClosing: false, qDrag: 0 }), 220); },
      scrimTap: (e) => { if (e.target === e.currentTarget) { if (this.state.qClosing) return; this.setState({ qClosing: true }); setTimeout(() => this.setState({ quit: false, qClosing: false, qDrag: 0 }), 220); } },
      qScrimCls: this.state.qClosing ? 'q-scrim-out' : 'q-scrim-in',
      qSheetCls: this.state.qClosing && !this.state.qDrag ? 'q-out' : (this.state.qEntered ? '' : 'q-in'),
      qDragY: this.state.qDrag || 0,
      qTrans: this.state.qDragging ? 'none' : 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)',
      qGrab: (e) => { if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); this.qY0 = e.clientY; this.setState({ qDragging: true }); },
      qMove: (e) => { if (this.qY0 == null) return; this.setState({ qDrag: Math.max(0, e.clientY - this.qY0) }); },
      qRelease: () => {
        if (this.qY0 == null) return;
        this.qY0 = null;
        if ((this.state.qDrag || 0) > 80) { this.setState({ qDragging: false, qClosing: true, qDrag: 520 }); setTimeout(() => this.setState({ quit: false, qClosing: false, qDrag: 0 }), 220); }
        else this.setState({ qDragging: false, qDrag: 0 });
      },
      confirmQuit: () => this.setState({ quit: false, step: exitTo(), results: [], run: this.state.run + 1 }),
      grammarBack: this.state.origin === 'test' ? 'Back to languages' : (this.state.origin === 'tab' ? 'Back to Learn' : 'Back to Grammar exercises'),
      grammarBackGo: () => this.setState({ step: exitTo() }),
      pickTopic: () => this.setState({ step: 'learn', run: this.state.run + 1 }),
      finish: finishStage,
      begin: () => startRun(true),
      // Train again: same four exercises without timers; only the total time is shown on Results.
      restart: () => startRun(false),
      toComplete: () => this.setState({ step: 6 }),
      // Complete · Continue: back to where the learner started (language picker in the test links).
      toStart: () => this.setState({ step: this.state.origin === 'test' ? 'lang' : (this.state.origin === 'tab' ? 'tab' : 'review'), results: [], seconds: 0, run: this.state.run + 1 }),
    };
  }
}
</script>
