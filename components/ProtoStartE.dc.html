<script type="text/x-dc" data-dc-script data-props='{"rows":{"editor":null},"onStart":{"editor":null},"onClose":{"editor":null},"language":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      // Rows from the session: section heading (teach_heading) as the title, the game as the subtitle.
      exercises: (Array.isArray(this.props.rows) ? this.props.rows : [{ name: 'Noun gender', skill: 'Form Forge' }, { name: 'Noun gender', skill: 'Lane Sort' }]).map((r, i) => ({ ...r, n: i + 1, delay: (0.2 + i * 0.08).toFixed(2) })),
      rounds: Array.isArray(this.props.rows) ? this.props.rows.length : 2,
      // Inside the Full flow this starts the run; on its own it does nothing.
      start: () => { if (typeof this.props.onStart === 'function') this.props.onStart(); },
      // X: back to where the learner came from (Learn tab or Grammar exercises list).
      close: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); },
    };
  }
}
</script>
